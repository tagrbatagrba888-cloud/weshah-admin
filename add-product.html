<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#073b29">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WESHAH">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>WESHAH — إضافة منتج</title>
<link rel="stylesheet" href="weshah.css">
<style>
.pe{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}
.pe-side{position:sticky;top:14px;display:flex;flex-direction:column;gap:16px}
.pe-side .card{margin:0}
.secnav{display:flex;gap:7px;overflow-x:auto;margin:0 0 16px;padding-bottom:4px;scrollbar-width:none}
.secnav::-webkit-scrollbar{display:none}
.secnav a{flex:0 0 auto;text-decoration:none;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:30px;border:1px solid var(--line);background:var(--paper);color:var(--ink);display:flex;align-items:center;gap:6px}
.secnav a:hover{border-color:var(--green2)}
.card[id]{scroll-margin-top:84px}
.counter{font-size:11px;color:var(--muted);float:left;font-weight:500}
.req{color:var(--red)}
.field.err input,.field.err select,.field.err textarea{border-color:var(--red);box-shadow:0 0 0 3px rgba(185,93,80,.12)}
.field .errmsg{display:none;color:var(--red);font-size:11.5px;margin-top:5px}
.field.err .errmsg{display:block}
.chiplist{display:flex;flex-wrap:wrap;gap:7px;padding:8px;border:1.5px solid var(--line);border-radius:11px;background:var(--input);min-height:46px;align-items:center}
.chiplist:focus-within{border-color:var(--green2);box-shadow:0 0 0 3px rgba(21,84,61,.12)}
.chiplist input{flex:1;min-width:110px;border:0 !important;box-shadow:none !important;padding:4px 6px !important;background:transparent !important}
.tagchip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:30px;padding:3px 6px 3px 11px;font-size:12.5px}
.tagchip button{border:0;background:rgba(120,132,125,.2);border-radius:50%;width:19px;height:19px;cursor:pointer;color:var(--ink);font-size:13px;line-height:1;padding:0}
.sizechip{display:inline-flex;align-items:center;gap:5px}
.sizechip.on{background:var(--green);border-color:var(--green);color:#fff}
body[data-theme="dark"] .sizechip.on{background:#1b6247;border-color:#1b6247}

/* الصور */
.pimgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:11px;margin-top:14px}
.pimg{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:var(--soft);cursor:grab}
.pimg.main{border-color:var(--gold)}
.pimg.drag{opacity:.4}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pimg .tag{position:absolute;top:6px;right:6px;background:var(--gold);color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px}
.pimg .tag.s{background:rgba(0,0,0,.55);right:auto;left:6px}
.pimg .ops{position:absolute;inset:auto 0 0 0;display:flex;justify-content:center;gap:4px;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.pimg .ops button{border:0;border-radius:8px;background:rgba(255,255,255,.92);color:#111;width:28px;height:28px;display:grid;place-items:center;cursor:pointer;padding:0}
.pimg .ops button:hover{background:#fff}
.pimg .ops .ic{width:14px;height:14px}
.pimg .ops .del{background:#ffe3df;color:#a4382c}
.pimg.loading{display:grid;place-items:center;font-size:11.5px;color:var(--muted);text-align:center;padding:8px;cursor:default}
.urlrow{display:flex;gap:8px;margin-top:12px}
.urlrow input{flex:1}
.imgnote{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.9}

/* ألوان ومقاسات */
.colorrow{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:12px}
.colorpill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:6px 8px 6px 10px;font-size:13px}
.cdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line);flex-shrink:0}
.colorpill select{padding:3px 6px;font-size:11.5px;border-radius:7px;border:1px solid var(--line);background:var(--input);color:var(--ink);max-width:96px;font-family:inherit}
.colorpill button{border:0;background:rgba(185,93,80,.15);color:var(--red);border-radius:50%;width:22px;height:22px;cursor:pointer;padding:0;font-size:14px;line-height:1}
.palette{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.palette button{width:30px;height:30px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;transition:.15s}
.palette button:hover{transform:scale(1.15)}
.addrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.addrow input[type=color]{width:46px;height:42px;padding:3px;border-radius:10px;border:1.5px solid var(--line);background:var(--input);cursor:pointer}
.addrow input[type=text]{flex:1;min-width:130px}

/* المتغيرات */
.vtable input{width:92px;padding:7px 9px;font-size:13px;border:1.5px solid var(--line);border-radius:9px;background:var(--input);color:var(--ink);font-family:inherit}
.vtable td:first-child{white-space:nowrap}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:10px;border-radius:12px;background:var(--soft)}
.bulk input{width:110px;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--input);color:var(--ink);font-family:inherit}
.totalbar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:var(--soft);margin-top:12px;font-weight:700}

/* مالية */
.fin{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.fin .box{background:var(--soft);border-radius:13px;padding:11px 13px}
.fin .box small{display:block;color:var(--muted);font-size:11.5px}
.fin .box b{font-size:16px}
.fin .box.loss b{color:var(--red)}

/* الباركود و QR */
.codes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.codebox{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--soft)}
.codebox h4{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.codeview{background:#fff;border-radius:12px;padding:10px;display:grid;place-items:center;min-height:120px;overflow:hidden}
.codeview svg{max-width:100%;height:auto}
.codeview.qr svg{width:190px;height:190px}
.codeview .ph{color:#8a948d;font-size:12.5px;text-align:center}
.seg{display:flex;background:rgba(120,132,125,.13);border-radius:11px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--paper);color:var(--green);box-shadow:0 1px 4px rgba(0,0,0,.1)}
body[data-theme="dark"] .seg button.on{color:#9ad6b8}
.codebtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.8}
.hint.bad{color:var(--red)} .hint.good{color:var(--ok)}
.mono{font-family:'DM Sans',monospace;direction:ltr;text-align:left}

/* أكواد الخصم */
.cpform{border:1.5px dashed var(--line);border-radius:16px;padding:16px;margin-top:14px;background:var(--soft)}
.cpform h4{margin:0 0 12px;font-size:14px}
.presets{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.cpprev{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cpprev .box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cpprev small{color:var(--muted);font-size:11.5px;display:block}
.cpprev b{font-size:14px}
.cplist{display:flex;flex-direction:column;gap:10px}
.cpitem{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--paper)}
.cpitem .code{font-family:'DM Sans',monospace;font-weight:800;letter-spacing:1px;font-size:15px;direction:ltr}
.cpitem .meta{flex:1;min-width:160px;font-size:12px;color:var(--muted);line-height:1.8}
.cpitem .meta b{color:var(--ink)}

/* المعاينة */
.pv{overflow:hidden;padding:0 !important}
.pv .ph{aspect-ratio:1;background:var(--soft);display:grid;place-items:center;color:var(--muted);position:relative}
.pv .ph img{width:100%;height:100%;object-fit:cover}
.pv .ph>.ic{width:54px;height:54px;opacity:.35}
.pv .ph .disc{position:absolute;top:12px;right:12px;background:var(--red);color:#fff;font-weight:800;font-size:13px;padding:4px 11px;border-radius:20px}
.pv .ph .st{position:absolute;top:12px;left:12px}
.pv .thumbs{display:flex;gap:6px;padding:8px 12px 0;overflow-x:auto}
.pv .thumbs img{width:44px;height:44px;border-radius:9px;object-fit:cover;border:2px solid var(--line);flex-shrink:0}
.pv .body{padding:14px 16px 16px}
.pv .body h3{margin:0 0 4px;font-size:16px;line-height:1.5}
.pv .cat{font-size:12px;color:var(--muted)}
.pv .price{display:flex;align-items:baseline;gap:9px;margin:8px 0;flex-wrap:wrap}
.pv .price b{font-size:22px}
.pv .price s{color:var(--muted);font-size:13px}
.pv .opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.pv .opts .cdot{width:20px;height:20px}
.pv .opts .sz{font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:1px 8px}
.pv .stock{font-size:12.5px;margin-top:10px;font-weight:600}
.score{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--green2) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex-shrink:0}
.ring span{width:44px;height:44px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-weight:800;font-size:14px}
.checks{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.checks .ok{color:var(--ok)} .checks .no{color:var(--muted)}
.savebox{display:flex;flex-direction:column;gap:9px}
.savebar{display:none}
.draftbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.specrow{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;margin-bottom:8px}
.specrow input{padding:9px 11px;font-size:13px;border:1.5px solid var(--line);border-radius:10px;background:var(--input);color:var(--ink);font-family:inherit;width:100%}
.dims{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.sw-row b{font-size:13px;display:block} .sw-row small{color:var(--muted);font-size:11.5px}

@media(max-width:1100px){
  .pe{grid-template-columns:1fr}
  .pe-side{position:static;order:2}
  .pv .ph{aspect-ratio:16/9}
  .pe-side .savebox-card{display:none}
  .savebar{display:flex;position:fixed;right:0;left:0;bottom:calc(var(--bar-h) + var(--safe-b));z-index:80;background:var(--paper);border-top:1px solid var(--line);padding:9px 14px;gap:9px;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
  .savebar .btn{flex:1}
  .main{padding-bottom:calc(var(--bar-h) + 90px + var(--safe-b))}
}
@media(max-width:700px){
  .fin{grid-template-columns:1fr 1fr}
  .codes{grid-template-columns:1fr}
  .cpprev{grid-template-columns:1fr}
  .dims{grid-template-columns:1fr 1fr}
  .specrow{grid-template-columns:1fr 1fr auto}
  .vtable input{width:78px}
}
</style>
</head>
<body data-theme="light">
<div id="app"></div>

<script type="module">
import {
  $, $$, esc, svg, safeHref, uid, mountShell, getConfig, hydrateImages, openModal, closeModal, confirmDialog, toast, download, debounce,
  compressImage, saveImage, deleteImage, db, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, serverTimestamp, Timestamp
} from './weshah-core.js';
import * as A from './weshah-accounting.js';
import * as C from './weshah-codes.js';

const params = new URLSearchParams(location.search);
let EDIT_ID = params.get('id') || '';
const page = mountShell({
  title: EDIT_ID ? 'تعديل منتج' : 'إضافة منتج جديد',
  sub: 'أدخل كل تفاصيل المنتج: الصور والألوان والمقاسات والمخزون والباركود وأكواد الخصم'
});

/* ================= ثوابت ================= */
const DRAFT_KEY = 'weshah-product-draft';
const MAX_IMAGES = 10;
const PALETTE = [['أسود', '#111111'], ['أبيض', '#ffffff'], ['بيج', '#d9c3a0'], ['ذهبي', '#c9a45c'], ['فضي', '#b8bcc2'], ['رمادي', '#808080'], ['أحمر', '#c0392b'], ['بوردو', '#6d1f2b'],
  ['وردي', '#e8a0b4'], ['أزرق', '#2f5fa8'], ['كحلي', '#1b2a4a'], ['سماوي', '#6fb7d8'], ['أخضر', '#2e7d4f'], ['زيتي', '#6b6b2f'], ['مينت', '#98d9c2'], ['برتقالي', '#e67e22'],
  ['أصفر', '#f1c40f'], ['بنفسجي', '#7d5ba6'], ['بني', '#6b4423'], ['كاكي', '#a89f6d']];
const SIZE_LETTERS = ['XS', 'S', 'M', 'L', 'XL', 'XXL', '3XL'];
const SIZE_NUMS = ['36', '38', '40', '42', '44', '46'];
const SIZE_OTHER = ['مقاس واحد'];
const TYPES = ['وشاح', 'طرحة', 'حجاب', 'عباية', 'فستان', 'قميص', 'بنطلون', 'حذاء', 'حقيبة', 'إكسسوار', 'عطر', 'أخرى'];
const DUR_PRESETS = [['15 دقيقة', 15, 'minute'], ['ساعة', 1, 'hour'], ['24 ساعة', 24, 'hour'], ['3 أيام', 3, 'day'], ['أسبوع', 1, 'week'], ['شهر', 1, 'month'], ['3 أشهر', 3, 'month'], ['سنة', 1, 'year']];
const SECTIONS = [['s-basic', 'الأساسيات', 'tag'], ['s-images', 'الصور', 'image'], ['s-variants', 'الألوان والمقاسات', 'star'], ['s-stock', 'المخزون', 'box'],
  ['s-price', 'الأسعار', 'coins'], ['s-codes', 'الباركود وQR', 'calc'], ['s-coupons', 'أكواد الخصم', 'percent'], ['s-more', 'التفاصيل والشحن', 'truck']];

const blank = () => ({
  name: '', nameEn: '', brand: '', category: '', type: '', condition: 'new', shortDesc: '', description: '', tags: [], status: 'active', featured: false,
  price: '', comparePrice: '', cost: '', trackStock: true, stock: '', lowStock: '5',
  sku: '', barcodeMode: 'random', barcodeType: 'ean13', barcode: '', qrSource: 'link', qrCustom: '', qrEcl: 'M',
  colors: [], sizes: [], variants: [], images: [], specs: [], weight: '', dimL: '', dimW: '', dimH: '', supplierId: '', returnPolicy: '', notes: ''
});
let P = blank();
let PID = EDIT_ID || ('p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7));
let existing = null;                       // مستند المنتج الحالي عند التعديل
let removedDocImages = [];                 // صور محفوظة تم حذفها (تُمسح من Firestore عند الحفظ)
let pendingCoupons = [];                   // أكواد جديدة تُحفظ مع المنتج
let savedCoupons = [];                     // أكواد المنتج المحفوظة
let dirty = false, saving = false;
const D = { products: [], suppliers: [], coupons: [] };
const cur = () => getConfig().accounting.currency || 'ج.م';
const m = n => A.fmtMoney(n, cur());
const N = A.num;
const isHex = s => /^#[0-9a-f]{6}$/i.test(s || '');
const safeImg = u => (/^(https?:\/\/|data:image\/)/i.test(String(u || '')) ? u : '');
const rand = (set, n) => { const a = new Uint32Array(n); crypto.getRandomValues(a); return [...a].map(x => set[x % set.length]).join(''); };
const SAFE = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const fmtDT = d => (d ? new Intl.DateTimeFormat('ar-EG', { dateStyle: 'medium', timeStyle: 'short' }).format(d) : '—');
const toLocalInput = d => { const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };

/* ================= الهيكل ================= */
page.innerHTML = `
  <div id="draftBar"></div>
  <nav class="secnav" aria-label="أقسام الصفحة">${SECTIONS.map(([id, l, ic]) => `<a href="#${id}" data-go="${id}">${svg(ic)}${l}</a>`).join('')}</nav>
  <div class="pe">
    <div class="pe-main">

      <section class="card" id="s-basic">
        <div class="card-head"><div><h2>${svg('tag')} المعلومات الأساسية</h2><p>الاسم والتصنيف والوصف</p></div></div>
        <div class="field" data-f="name"><label>اسم المنتج <span class="req">*</span> <span class="counter" id="cnt-name">0/120</span></label>
          <input data-k="name" maxlength="120" placeholder="مثال: وشاح حرير طبيعي بنقشة ذهبية" autocomplete="off"><div class="errmsg"></div></div>
        <div class="row-2">
          <div class="field"><label>الاسم بالإنجليزية (اختياري)</label><input data-k="nameEn" dir="ltr" maxlength="120" placeholder="Natural silk scarf"></div>
          <div class="field"><label>العلامة التجارية / الماركة</label><input data-k="brand" maxlength="60" placeholder="WESHAH"></div>
        </div>
        <div class="row-3">
          <div class="field"><label>القسم</label><input data-k="category" list="catList" maxlength="60" placeholder="مثال: وشاحات"><datalist id="catList"></datalist></div>
          <div class="field"><label>النوع</label><input data-k="type" list="typeList" maxlength="60" placeholder="مثال: وشاح"><datalist id="typeList"></datalist></div>
          <div class="field"><label>الحالة</label><select data-k="condition"><option value="new">جديد</option><option value="used">مستعمل</option><option value="refurb">مجدّد</option></select></div>
        </div>
        <div class="field"><label>وصف مختصر <span class="counter" id="cnt-shortDesc">0/160</span></label><input data-k="shortDesc" maxlength="160" placeholder="سطر يلخّص أهم ميزة في المنتج"></div>
        <div class="field"><label>الوصف الكامل</label><textarea data-k="description" rows="5" maxlength="4000" placeholder="الخامة، طريقة الاستخدام، المميزات، العناية..."></textarea></div>
        <div class="field"><label>الوسوم (Tags)</label>
          <div class="chiplist" id="tagBox"><input id="tagIn" placeholder="اكتب وسمًا واضغط Enter" maxlength="30"></div>
          <small>تساعد في البحث والتصفية. افصل بـ Enter أو فاصلة.</small></div>
        <div class="row-2">
          <div class="field"><label>حالة النشر</label><select data-k="status"><option value="active">نشط — يظهر في المتجر</option><option value="draft">مسودة — مخفي</option><option value="archived">مؤرشف</option></select></div>
          <div class="sw-row"><div><b>منتج مميّز</b><small>يظهر في الواجهة وأعلى النتائج</small></div><label class="switch"><input type="checkbox" data-k="featured" data-t="check"><span></span></label></div>
        </div>
      </section>

      <section class="card" id="s-images">
        <div class="card-head"><div><h2>${svg('image')} صور المنتج</h2><p>ارفع عدة صور أو أضف روابط. تُضغط بقوة وتُحفظ في مستندات Firestore العادية (بدون Storage)</p></div><span class="badge gray" id="imgCount">0 / ${MAX_IMAGES}</span></div>
        <label class="file-upload" id="drop" for="imgFiles">${svg('upload')}<b>اضغط لاختيار صور أو اسحبها هنا</b><small>يمكن اختيار عدة صور معًا · PNG · JPG · WebP</small>
          <input type="file" id="imgFiles" accept="image/*" multiple></label>
        <div class="urlrow"><input type="url" id="imgUrl" dir="ltr" placeholder="أو الصق رابط صورة https://..."><button class="btn btn-secondary" type="button" id="addUrl">${svg('link')} إضافة رابط</button></div>
        <div class="pimgs" id="pimgs"></div>
        <div class="imgnote" id="imgNote">أول صورة هي الصورة الرئيسية. اسحب الصور لإعادة الترتيب أو استخدم الأسهم.</div>
      </section>

      <section class="card" id="s-variants">
        <div class="card-head"><div><h2>${svg('star')} الألوان والمقاسات</h2><p>اختياري — أضف ما ينطبق على المنتج فقط</p></div></div>
        <div class="field"><label>الألوان</label>

/* ================= ربط الحقول البسيطة ================= */
function bindFields() {
  $$('[data-k]').forEach(el => {
    const k = el.dataset.k;
    if (el.dataset.t === 'check') el.checked = !!P[k]; else el.value = P[k] ?? '';
  });
}
document.addEventListener('input', e => {
  const el = e.target.closest('[data-k]'); if (!el) return;
  const k = el.dataset.k;
  P[k] = el.dataset.t === 'check' ? el.checked : el.value;
  el.closest('.field')?.classList.remove('err');
  touched(k);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-k]'); if (!el) return;
  if (el.dataset.t === 'check') { P[el.dataset.k] = el.checked; touched(el.dataset.k); }
  else if (el.tagName === 'SELECT') { P[el.dataset.k] = el.value; touched(el.dataset.k); }
});

const CODE_KEYS = new Set(['sku', 'barcode', 'qrSource', 'qrCustom', 'qrEcl', 'name', 'price']);
function touched(k) {
  dirty = true; saveDraft();
  if (k === 'trackStock') renderStock();
  if (k === 'qrSource') $('#qrCustomWrap').style.display = P.qrSource === 'custom' ? '' : 'none';
  if (k === 'barcode' && P.barcodeMode === 'manual') { P.barcode = normalizeManual(P.barcode); const bi = $('#bcInput'); if (bi && bi.value !== P.barcode) bi.value = P.barcode; }
  if (CODE_KEYS.has(k)) renderCodes(k !== 'barcode');
  if (k === 'price') renderCouponForm(true);
  if (k === 'stock' || k === 'lowStock') updateStockTotal();
  derive();
}

/* ================= المسودة التلقائية ================= */
const saveDraft = debounce(() => {
  if (EDIT_ID) return;
  try {
    const { images, ...rest } = P;
    localStorage.setItem(DRAFT_KEY, JSON.stringify({ ...rest, images: images.filter(i => i.kind === 'url').map(({ k, kind, url }) => ({ k, kind, url })), _t: Date.now() }));
  } catch (_) {}
}, 600);
function offerDraft() {
  if (EDIT_ID) return;
  let d = null; try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (_) {}
  if (!d || !(d.name || d.price || d.description)) return;
  $('#draftBar').innerHTML = `<div class="alert-item info draftbar" style="margin-bottom:14px">${svg('refresh')}<div style="flex:1">لديك مسودة منتج غير محفوظة${d.name ? ` («${esc(d.name)}»)` : ''} — ${A.fmtDate(new Date(d._t))}</div>
    <button class="btn btn-primary btn-sm" type="button" id="draftYes">استعادة</button><button class="btn btn-secondary btn-sm" type="button" id="draftNo">تجاهل</button></div>`;
  $('#draftYes').onclick = () => { delete d._t; P = { ...blank(), ...d }; P.images = (P.images || []).map(i => ({ ...i, k: i.k || uid('i') })); $('#draftBar').innerHTML = ''; fullRender(); toast('✓ تمت استعادة المسودة'); };
  $('#draftNo').onclick = () => { try { localStorage.removeItem(DRAFT_KEY); } catch (_) {} $('#draftBar').innerHTML = ''; };
}
window.addEventListener('beforeunload', e => { if (dirty && !saving) { e.preventDefault(); e.returnValue = ''; } });

/* ================= الوسوم ================= */
function renderTags() {
  const box = $('#tagBox'), inp = $('#tagIn');
  $$('.tagchip', box).forEach(x => x.remove());
  P.tags.forEach((t, i) => inp.insertAdjacentHTML('beforebegin', `<span class="tagchip">${esc(t)}<button type="button" data-rmtag="${i}" aria-label="حذف الوسم">×</button></span>`));
}
function addTag(raw) {
  raw.split(/[,،]/).map(s => s.trim()).filter(Boolean).forEach(t => { if (!P.tags.includes(t) && P.tags.length < 20) P.tags.push(t); });
  renderTags(); touched('tags');
}
$('#tagIn').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ',' || e.key === '،') { e.preventDefault(); addTag(e.target.value); e.target.value = ''; }
  else if (e.key === 'Backspace' && !e.target.value && P.tags.length) { P.tags.pop(); renderTags(); touched('tags'); }
});
$('#tagIn').addEventListener('blur', e => { if (e.target.value.trim()) { addTag(e.target.value); e.target.value = ''; } });
$('#tagBox').addEventListener('click', e => { const b = e.target.closest('[data-rmtag]'); if (b) { P.tags.splice(Number(b.dataset.rmtag), 1); renderTags(); touched('tags'); } else $('#tagIn').focus(); });

/* ================= الصور ================= */
const fmtKB = b => (b / 1024).toFixed(b < 10240 ? 1 : 0) + ' ك.ب';
const imgSrcOf = i => (i.kind === 'pending' ? i.dataUrl : i.kind === 'url' ? safeImg(i.url) : '');

function renderImages() {
  const el = $('#pimgs');
  el.innerHTML = P.images.map((im, idx) => {
    if (im.kind === 'loading') return `<div class="pimg loading" data-ik="${im.k}">${svg('refresh')}<br>جارٍ الضغط...</div>`;
    const inner = im.kind === 'doc' ? `<img data-img="${esc(im.id)}" alt="صورة ${idx + 1}">` : `<img src="${esc(imgSrcOf(im))}" alt="صورة ${idx + 1}" loading="lazy">`;
    const size = im.bytes ? `<span class="tag s">${fmtKB(im.bytes)}</span>` : (im.kind === 'url' ? '<span class="tag s">رابط</span>' : '');
    return `<div class="pimg ${idx === 0 ? 'main' : ''}" draggable="true" data-idx="${idx}">${inner}${idx === 0 ? '<span class="tag">رئيسية</span>' : ''}${size}
      <div class="ops">
        ${idx !== 0 ? `<button type="button" data-imgop="main" data-idx="${idx}" title="جعلها رئيسية" aria-label="جعلها رئيسية">${svg('star')}</button>` : ''}
        <button type="button" data-imgop="prev" data-idx="${idx}" title="تقديم" aria-label="تقديم"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
        <button type="button" data-imgop="next" data-idx="${idx}" title="تأخير" aria-label="تأخير"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <button type="button" class="del" data-imgop="del" data-idx="${idx}" title="حذف" aria-label="حذف">${svg('trash')}</button></div></div>`;
  }).join('') || `<div class="empty-list" style="grid-column:1/-1">${svg('image')}<div>لا توجد صور بعد</div></div>`;
  hydrateImages(el);
  const n = P.images.filter(i => i.kind !== 'loading').length;
  $('#imgCount').textContent = `${n} / ${MAX_IMAGES}`;
  const pend = P.images.filter(i => i.kind === 'pending');
  const bytes = pend.reduce((s, i) => s + i.bytes, 0), orig = pend.reduce((s, i) => s + i.orig, 0);
  $('#imgNote').innerHTML = pend.length
    ? `${pend.length} صورة جاهزة للرفع: الأصل <b>${fmtKB(orig)}</b> ← بعد الضغط <b>${fmtKB(bytes)}</b> (توفير ${Math.round((1 - bytes / Math.max(orig, 1)) * 100)}٪) · ستُحفظ في <b>${pend.reduce((s, i) => s + Math.ceil(i.dataUrl.length / 30000) + 1, 0)}</b> مستند Firestore.`
    : 'أول صورة هي الصورة الرئيسية. اسحب الصور لإعادة الترتيب أو استخدم الأسهم.';
  renderColors();
}

async function addFiles(files) {
  const list = [...files].filter(f => /^image\//.test(f.type));
  if (!list.length) return toast('اختر ملفات صور فقط', 'error');
  for (const f of list) {
    if (P.images.length >= MAX_IMAGES) { toast(`الحد الأقصى ${MAX_IMAGES} صور`, 'warn'); break; }
    if (f.size > 20 * 1024 * 1024) { toast(`«${f.name}» أكبر من 20 ميجا`, 'error'); continue; }
    const k = uid('i'); P.images.push({ k, kind: 'loading' }); renderImages();
    try {
      const r = await compressImage(f, { maxDim: 800, targetBytes: 40000, minDim: 160, keepAlpha: false });
      const i = P.images.findIndex(x => x.k === k);
      if (i >= 0) P.images[i] = { k, kind: 'pending', dataUrl: r.dataUrl, bytes: r.bytes, orig: f.size, name: f.name, w: r.width, h: r.height };
    } catch (err) { console.error(err); P.images = P.images.filter(x => x.k !== k); toast(`تعذّر معالجة «${f.name}»`, 'error'); }
    renderImages();
  }
  $('#imgFiles').value = ''; touched('images');
}
$('#imgFiles').addEventListener('change', e => addFiles(e.target.files));
const drop = $('#drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));

$('#addUrl').addEventListener('click', () => {
  const u = $('#imgUrl').value.trim();
  if (!/^https?:\/\/\S+$/i.test(u)) return toast('الصق رابطًا صحيحًا يبدأ بـ https://', 'error');
  if (P.images.length >= MAX_IMAGES) return toast(`الحد الأقصى ${MAX_IMAGES} صور`, 'warn');
  if (P.images.some(i => i.kind === 'url' && i.url === u)) return toast('هذا الرابط مضاف بالفعل', 'warn');
  P.images.push({ k: uid('i'), kind: 'url', url: u }); $('#imgUrl').value = ''; renderImages(); touched('images');
});
$('#imgUrl').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#addUrl').click(); } });

function moveImg(from, to) {
  if (to < 0 || to >= P.images.length || from === to) return;
  const [x] = P.images.splice(from, 1); P.images.splice(to, 0, x); renderImages(); touched('images');
}
$('#pimgs').addEventListener('click', e => {
  const b = e.target.closest('[data-imgop]'); if (!b) return;
  const i = Number(b.dataset.idx), op = b.dataset.imgop;
  if (op === 'main') moveImg(i, 0);
  else if (op === 'prev') moveImg(i, i - 1);
  else if (op === 'next') moveImg(i, i + 1);
  else if (op === 'del') {
    const im = P.images[i];
    if (im.kind === 'doc') removedDocImages.push(im.id);
    P.colors.forEach(c => { if (c.imageKey === im.k) c.imageKey = ''; });
    P.images.splice(i, 1); renderImages(); touched('images');
  }
});
let dragFrom = null;
$('#pimgs').addEventListener('dragstart', e => { const t = e.target.closest('.pimg'); if (!t || t.dataset.idx === undefined) return; dragFrom = Number(t.dataset.idx); t.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', 'x'); } catch (_) {} });
$('#pimgs').addEventListener('dragend', e => { e.target.closest('.pimg')?.classList.remove('drag'); dragFrom = null; });
$('#pimgs').addEventListener('dragover', e => { if (dragFrom !== null) e.preventDefault(); });
$('#pimgs').addEventListener('drop', e => { const t = e.target.closest('.pimg'); if (t && dragFrom !== null && t.dataset.idx !== undefined) { e.preventDefault(); moveImg(dragFrom, Number(t.dataset.idx)); } dragFrom = null; });

function renderColors() {

  $('#colorRow').innerHTML = P.colors.map((c, i) => `<div class="colorpill"><span class="cdot" style="background:${isHex(c.hex) ? c.hex : '#ccc'}"></span><b>${esc(c.name)}</b>

    <button type="button" data-rmcolor="${i}" aria-label="حذف اللون">×</button></div>`).join('') || '<div class="muted" style="font-size:12.5px">لم تُضف ألوانًا بعد</div>';
}
$('#palette').innerHTML = PALETTE.map(([n, h]) => `<button type="button" data-pal="${esc(n)}|${h}" style="background:${h}" title="${esc(n)}" aria-label="${esc(n)}"></button>`).join('');
function addColor(name, hex) {
  name = name.trim(); if (!name) return toast('اكتب اسم اللون', 'error');

  P.colors.push({ name, hex: isHex(hex) ? hex : '#cccccc', imageKey: '' }); renderColors(); rebuildVariants(); touched('colors');
}

function renderSizes() {

function genSku() {

}
function genBarcode() {
  for (let i = 0; i < 30; i++) {
    const b = P.barcodeType === 'ean13' ? C.randomEan13() : 'WSH' + rand('0123456789ABCDEFGHJKLMNPQRSTUVWXYZ', 9);
    if (!D.products.some(p => p.id !== PID && p.barcode === b)) return b;
  }
  return P.barcodeType === 'ean13' ? C.randomEan13() : 'WSH' + rand(SAFE, 10);
}

  return v;
}

  if (t === 'ean13') {
    if (v.length === 12) { const full = v + C.ean13Check(v); return { ok: true, value: full, note: `تم إكمال رقم التحقق تلقائيًا: ${full}` }; }

    if (!C.ean13Valid(v)) return { ok: false, msg: `رقم التحقق غير صحيح — الصحيح: ${v.slice(0, 12)}${C.ean13Check(v.slice(0, 12))}` };
    return { ok: true, value: v };
  }
  if (!C.code128Valid(v)) return { ok: false, msg: 'Code 128 يقبل حروفًا إنجليزية وأرقامًا ورموزًا فقط (حتى 40 حرفًا).' };
  return { ok: true, value: v };
}
function qrContent() {

  const bs = barcodeState();
  switch (P.qrSource) {

    case 'custom': return P.qrCustom.trim();

}

async function validate() {
  $$('.field.err').forEach(f => f.classList.remove('err'));

  if (P.name.trim().length < 2) add('name', 'اكتب اسم المنتج (حرفان على الأقل)');
  if (!(N(P.price) > 0)) add('price', 'سعر البيع مطلوب ويجب أن يكون أكبر من صفر');

  if (P.cost !== '' && N(P.cost) < 0) add('cost', 'التكلفة لا تكون سالبة');
  if (P.sku.trim() && D.products.some(p => p.id !== PID && p.sku && p.sku === P.sku.trim())) add('sku', 'رمز SKU مستخدم في منتج آخر');

  if (errs.length) { $(`[data-f=${errs[0]}]`)?.scrollIntoView({ block: 'center', behavior: 'smooth' }); toast('راجع الحقول المظللة بالأحمر', 'error'); return false; }
  if (CF && (CF.value !== '' || CF.amount !== '')) {
    const ok = await confirmDialog('هناك كود خصم لم تضفه بعد وسيُتجاهل. المتابعة بدونه؟', { title: 'كود غير مضاف', okLabel: 'متابعة بدونه', danger: false });
    if (!ok) { $('#cpFormWrap').scrollIntoView({ block: 'center', behavior: 'smooth' }); return false; }
  }
  if (P.cost !== '' && N(P.cost) > N(P.price)) { if (!await confirmDialog('سعر التكلفة أعلى من سعر البيع — ستُباع كل قطعة بخسارة. هل أنت متأكد؟', { title: 'خسارة في كل قطعة', okLabel: 'نعم، احفظ', danger: false })) return false; }
  if (!P.images.some(i => i.kind !== 'loading')) { if (!await confirmDialog('المنتج بدون صور. المنتجات ذات الصور تُباع أكثر بكثير. المتابعة بدون صور؟', { title: 'لا توجد صور', okLabel: 'متابعة', danger: false })) return false; }
  if (P.images.some(i => i.kind === 'loading')) { toast('انتظر انتهاء ضغط الصور', 'warn'); return false; }
  return true;
}

async function save(mode) {
  if (saving) return;
  if (!await validate()) return;
  saving = true; derive();
  const savedNow = [];
  try {
    // 1) رفع الصور الجديدة إلى مستندات Firestore
    const pend = P.images.filter(i => i.kind === 'pending');
    for (let n = 0; n < pend.length; n++) {
      toast(`جارٍ حفظ الصور (${n + 1}/${pend.length})...`);
      const im = pend[n];
      const r = await saveImage(im.dataUrl, { kind: 'product', name: im.name || '', width: im.w, height: im.h });
      savedNow.push(r.id); Object.assign(im, { kind: 'doc', id: r.id }); delete im.dataUrl;
    }
    // 2) بناء مستند المنتج
    const imgs = P.images.filter(i => i.kind === 'doc' || i.kind === 'url');
    const keyIdx = new Map(imgs.map((i, n) => [i.k, n]));
    const primary = imgs[0];
    const bs = barcodeState();
    const total = totalStock();
    const sup = D.suppliers.find(s => s.id === P.supplierId);
    const payload = {
      name: P.name.trim(), nameEn: P.nameEn.trim(), brand: P.brand.trim(), category: P.category.trim(), type: P.type.trim(), condition: P.condition,
      shortDesc: P.shortDesc.trim(), description: P.description.trim(), tags: P.tags, status: P.status, featured: !!P.featured,
      price: A.r2(N(P.price)), comparePrice: N(P.comparePrice) > 0 ? A.r2(N(P.comparePrice)) : 0, cost: P.cost === '' ? null : A.r2(N(P.cost)),
      trackStock: !!P.trackStock, stock: P.trackStock ? total : null, lowStock: Math.max(0, Math.round(N(P.lowStock))),
      sku: P.sku.trim(), barcode: bs.ok && P.barcodeMode !== 'none' ? bs.value : '', barcodeType: P.barcodeType, barcodeMode: P.barcodeMode,
      qrSource: P.qrSource, qrCustom: P.qrCustom.trim(), qrEcl: P.qrEcl,
      colors: P.colors.map(c => ({ name: c.name, hex: c.hex, imageIndex: c.imageKey && keyIdx.has(c.imageKey) ? keyIdx.get(c.imageKey) : -1 })),
      sizes: P.sizes,
      variants: P.variants.map((v, i) => ({ key: v.key, color: v.color, hex: v.hex, size: v.size, stock: Math.max(0, Math.round(N(v.stock))), price: N(v.price) > 0 ? A.r2(N(v.price)) : 0, sku: `${P.sku.trim() || 'V'}-${i + 1}` })),
      images: imgs.map(i => (i.kind === 'doc' ? { kind: 'doc', id: i.id } : { kind: 'url', url: i.url })),
      imageId: primary && primary.kind === 'doc' ? primary.id : '', image: primary && primary.kind === 'url' ? primary.url : '',
      specs: P.specs.filter(s => s.k.trim() && s.v.trim()).map(s => ({ k: s.k.trim(), v: s.v.trim() })),
      weight: N(P.weight) || 0, dimensions: { l: N(P.dimL) || 0, w: N(P.dimW) || 0, h: N(P.dimH) || 0 },
      supplierId: P.supplierId, supplierName: sup ? sup.name : '', returnPolicy: P.returnPolicy.trim(), notes: P.notes.trim(),
      updatedAt: serverTimestamp()
    };
    if (!existing) payload.createdAt = serverTimestamp();
    await setDoc(doc(db, 'products', PID), payload, { merge: true });
    // 3) أكواد الخصم
    for (const c of pendingCoupons) {
      const { tmp, spec, ...c2 } = c;
      const w = resolveWindow(spec, new Date());
      const body = { ...c2, exact: true, startsAt: Timestamp.fromDate(w.start), expiresAt: w.end ? Timestamp.fromDate(w.end) : null, productId: PID, productName: payload.name, createdAt: serverTimestamp() };
      const ref = await addDoc(collection(db, 'coupons'), body);
      savedCoupons.push({ id: ref.id, ...c2, exact: true, startsAt: w.start, expiresAt: w.end, productId: PID, productName: payload.name }); D.coupons.push({ id: ref.id, code: c2.code });
    }
    pendingCoupons = [];
    if (existing && existing.name !== payload.name) for (const c of savedCoupons) { try { await updateDoc(doc(db, 'coupons', c.id), { productName: payload.name }); } catch (_) {} }
    // 4) تنظيف الصور المحذوفة
    for (const id of removedDocImages) deleteImage(id).catch(() => {});
    removedDocImages = [];
    existing = { ...payload, id: PID };
    const i = D.products.findIndex(p => p.id === PID); const rec = { id: PID, ...payload }; if (i >= 0) D.products[i] = rec; else D.products.push(rec);
    dirty = false; try { localStorage.removeItem(DRAFT_KEY); } catch (_) {}
    if (mode !== 'new') EDIT_ID = PID;
    saving = false; renderCoupons(); renderImages(); derive();
    if (mode === 'new') { toast('✓ تم حفظ المنتج'); resetForNew(); }
    else showSuccess(payload.name);
  } catch (err) {
    console.error(err); saving = false; derive();
    savedNow.forEach(id => deleteImage(id).catch(() => {}));
    openModal({ title: 'تعذّر الحفظ', body: `<p class="confirm-msg">${esc(err.code || err.message || 'خطأ غير معروف')}</p><p class="hint">تأكد من قواعد Firestore: يجب أن تسمح بالكتابة على <b>products</b> و<b>images</b> و<b>image_chunks</b> و<b>coupons</b>. بياناتك ما زالت في الصفحة ولم تضِع.</p>`, hideSave: true, cancelLabel: 'حسنًا' });
  }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-savemode]'); if (b) save(b.dataset.savemode); });

function showSuccess(name) {
  const box = openModal({ title: '✓ تم حفظ المنتج', body: `<p class="confirm-msg"><b>${esc(name)}</b> محفوظ في Firestore${EDIT_ID ? '' : ' وأصبح جاهزًا'}.</p>`, hideSave: true, cancelLabel: 'متابعة التعديل' });
  const acts = $('.modal-actions', box);
  const add = (html, fn) => { const b = document.createElement('button'); b.className = 'btn btn-primary'; b.type = 'button'; b.innerHTML = html; b.onclick = fn; acts.prepend(b); };
  if (!EDIT_ID) add(`${svg('plus')} إضافة منتج آخر`, () => { closeModal(); resetForNew(); });
  add(`${svg('chart')} المنتجات والتكلفة`, () => { location.href = 'index.html#products'; });
  if (!EDIT_ID) history.replaceState(null, '', `add-product.html?id=${encodeURIComponent(PID)}`);
}
function resetForNew() {
  P = blank(); PID = 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); existing = null; EDIT_ID = ''; removedDocImages = []; pendingCoupons = []; savedCoupons = []; CF = null; dirty = false;
  history.replaceState(null, '', 'add-product.html'); fullRender(); window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ================= تحميل البيانات ================= */
function fillLists() {
  const uniq = k => [...new Set(D.products.map(p => String(p[k] || '').trim()).filter(Boolean))];
  $('#catList').innerHTML = uniq('category').map(c => `<option value="${esc(c)}">`).join('');
  $('#typeList').innerHTML = [...new Set([...TYPES, ...uniq('type')])].map(c => `<option value="${esc(c)}">`).join('');
  $('#supplierSel').innerHTML = '<option value="">— بدون —</option>' + D.suppliers.map(s => `<option value="${esc(s.id)}">${esc(s.name || s.id)}</option>`).join('');
  $('#supplierSel').value = P.supplierId || '';
}
function fromDoc(d) {
  const p = blank();
  const s = v => (v === undefined || v === null ? '' : String(v));
  Object.assign(p, {
    name: s(d.name || d.title), nameEn: s(d.nameEn), brand: s(d.brand), category: s(d.category), type: s(d.type), condition: d.condition || 'new', shortDesc: s(d.shortDesc),
    description: s(d.description), tags: Array.isArray(d.tags) ? d.tags : [], status: d.status || 'active', featured: !!d.featured,
    price: s(d.price), comparePrice: d.comparePrice ? s(d.comparePrice) : '', cost: d.cost === null || d.cost === undefined ? s(d.costPrice ?? d.purchasePrice ?? '') : s(d.cost),
    trackStock: d.trackStock !== false, stock: s(d.stock ?? d.quantity ?? d.qty ?? ''), lowStock: s(d.lowStock ?? 5),
    sku: s(d.sku), barcode: s(d.barcode), barcodeType: d.barcodeType || (/^\d{13}$/.test(s(d.barcode)) || !d.barcode ? 'ean13' : 'code128'),
    barcodeMode: d.barcode ? (d.barcodeMode === 'random' ? 'random' : 'manual') : 'none',
    qrSource: d.qrSource || 'link', qrCustom: s(d.qrCustom), qrEcl: d.qrEcl || 'M',
    specs: Array.isArray(d.specs) ? d.specs.map(x => ({ k: s(x.k), v: s(x.v) })) : [], weight: d.weight ? s(d.weight) : '',
    dimL: d.dimensions?.l ? s(d.dimensions.l) : '', dimW: d.dimensions?.w ? s(d.dimensions.w) : '', dimH: d.dimensions?.h ? s(d.dimensions.h) : '',
    supplierId: s(d.supplierId), returnPolicy: s(d.returnPolicy), notes: s(d.notes)
  });
  let imgs = Array.isArray(d.images) ? d.images.map(i => ({ k: uid('i'), ...i })) : [];
  if (!imgs.length) { if (d.imageId) imgs.push({ k: uid('i'), kind: 'doc', id: d.imageId }); else if (d.image) imgs.push({ k: uid('i'), kind: 'url', url: d.image }); }
  p.images = imgs;
  p.colors = (Array.isArray(d.colors) ? d.colors : []).map(c => ({ name: s(c.name || c), hex: isHex(c.hex) ? c.hex : '#cccccc', imageKey: c.imageIndex >= 0 && imgs[c.imageIndex] ? imgs[c.imageIndex].k : '' }));
  p.sizes = Array.isArray(d.sizes) ? d.sizes.map(s) : [];
  p.variants = Array.isArray(d.variants) ? d.variants.map(v => ({ key: s(v.key), color: s(v.color), hex: s(v.hex), size: s(v.size), stock: s(v.stock), price: v.price ? s(v.price) : '', sku: s(v.sku) })) : [];
  return p;
}

function fullRender() {
  bindFields(); renderTags(); renderSizes(); renderColors(); renderImages();
  if (P.colors.length || P.sizes.length) { const keep = P.variants; rebuildVariants(); if (!keep.length) { /* جديد */ } }
  renderStock(); renderSpecs(); renderCoupons(); renderCouponForm(); fillLists();
  $('#qrCustomWrap').style.display = P.qrSource === 'custom' ? '' : 'none';
  if (!P.sku) { P.sku = genSku(); $('[data-k=sku]').value = P.sku; }
  if (P.barcodeMode === 'random' && !P.barcode) P.barcode = genBarcode();
  renderCodes(); derive();
}

$$('[data-go]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); $('#' + a.dataset.go).scrollIntoView({ behavior: 'smooth', block: 'start' }); }));

async function init() {
  $('#pv').innerHTML = '<div class="skeleton" style="min-height:300px"></div>';
  const [p, s, c] = await Promise.allSettled([getDocs(collection(db, 'products')), getDocs(collection(db, 'suppliers')), getDocs(collection(db, 'coupons'))]);
  if (p.status === 'fulfilled') D.products = p.value.docs.map(d => ({ id: d.id, ...d.data() }));
  if (s.status === 'fulfilled') D.suppliers = s.value.docs.map(d => ({ id: d.id, ...d.data() }));
  if (c.status === 'fulfilled') D.coupons = c.value.docs.map(d => ({ id: d.id, ...d.data() }));
  if (p.status === 'rejected') toast('تعذّر قراءة المنتجات (قواعد Firestore؟) — فحص التكرار غير متاح', 'warn');
  if (EDIT_ID) {
    const snap = await getDoc(doc(db, 'products', EDIT_ID)).catch(() => null);
    if (!snap || !snap.exists()) { page.innerHTML = `<div class="card"><div class="empty-state">${svg('box')}<h3>المنتج غير موجود</h3><p>ربما حُذف أو الرابط غير صحيح. <a href="add-product.html">إضافة منتج جديد</a></p></div></div>`; return; }
    existing = { id: EDIT_ID, ...snap.data() }; P = fromDoc(snap.data());
    const rawVariants = P.variants; fullRenderEdit(rawVariants);
    savedCoupons = D.coupons.filter(x => x.productId === EDIT_ID).map(x => ({ ...x, startsAt: A.toDate(x.startsAt), expiresAt: A.toDate(x.expiresAt) }));
    renderCoupons();
  } else { fullRender(); offerDraft(); }
}
function fullRenderEdit(rawVariants) {
  // نحافظ على كميات المتغيرات المحفوظة بدل إعادة توليدها فارغة
  bindFields(); renderTags(); renderSizes(); renderImages();
  P.variants = rawVariants; renderStock(); renderSpecs(); renderCoupons(); fillLists();
  $('#qrCustomWrap').style.display = P.qrSource === 'custom' ? '' : 'none';
  renderCodes(); derive();
}
init();
</script>
</body>
</html>
