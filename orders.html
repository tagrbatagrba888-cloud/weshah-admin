<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#073b29">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WESHAH">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>WESHAH — الطلبات</title>
<link rel="stylesheet" href="weshah.css">
<style>
/* ===== شريط القطار ===== */
.train-card{padding:16px 14px 10px;margin-bottom:16px}
.train-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 6px 10px;flex-wrap:wrap}
.train-h h3{margin:0;font-size:14px}
.train{display:flex;align-items:flex-start;overflow-x:auto;padding:4px 4px 10px;scrollbar-width:thin}
.stn{flex:1 0 98px;min-width:98px;text-align:center;position:relative;cursor:pointer;background:none;border:0;padding:0;color:inherit;font-family:inherit}
.stn::before{content:"";position:absolute;top:21px;right:0;left:0;height:5px;background:var(--line);z-index:0}
.stn:first-child::before{right:50%}.stn:last-child::before{left:50%}
.stn.past::before{background:var(--c)}
.stn .dot{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;background:var(--paper);border:4px solid var(--c);color:var(--c);display:grid;place-items:center;margin:0 auto;font-weight:800;font-size:14px;transition:.18s;font-style:normal;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.stn:hover .dot{transform:scale(1.08)}
.stn.on .dot{background:var(--c);color:#fff;box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 22%,transparent)}
.stn.here .dot{background:var(--c);color:#fff;box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 25%,transparent)}
.stn b{display:block;font-size:11.5px;margin-top:7px;line-height:1.45;padding:0 4px}
.stn.sep{flex:0 0 28px;min-width:28px;cursor:default}.stn.sep::before{background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 11px)}
.stn.branch::before{background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 11px)}
.schip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.schip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
body[data-theme="dark"] .schip{filter:brightness(1.35)}
/* ===== الأدوات ===== */
.otools{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.otools .search{flex:1;min-width:230px;position:relative;display:flex;gap:6px}
.otools .search input{flex:1;min-width:0;padding:10px 12px 10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:13.5px;outline:none}
.otools .search input:focus{border-color:var(--green2)}
.otools select{padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:13px}
.ibtn{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);display:grid;place-items:center;flex-shrink:0;transition:.15s;cursor:pointer}
.ibtn:hover{border-color:var(--green2)}.ibtn.rec{background:var(--red);color:#fff;border-color:var(--red);animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(185,93,80,.22)}}
.bulk{position:sticky;top:8px;z-index:25;display:none;align-items:center;gap:8px;flex-wrap:wrap;background:var(--green);color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:12px;box-shadow:0 10px 30px rgba(7,59,41,.3)}
.bulk.show{display:flex}.bulk b{margin-left:auto}
.bulk .btn{background:rgba(255,255,255,.14);color:#fff}.bulk .btn:hover{background:rgba(255,255,255,.26)}.bulk .btn.d{background:#b95d50}
.ot td{vertical-align:middle}.ot tr.sel{background:color-mix(in srgb,var(--green2) 9%,transparent)}
.ot .no{font-family:'DM Sans',monospace;font-weight:800;letter-spacing:.3px;direction:ltr;display:inline-block}
.ot .no a{color:inherit}.ot .no a:hover{color:var(--green2);text-decoration:underline}
.ot small{display:block;color:var(--muted);font-size:11.5px}
.ot td.n,.ot th.n{white-space:nowrap}
.ot .act{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}
.ot input[type=checkbox]{width:17px;height:17px;accent-color:var(--green2)}
.nextbtn{font-size:11.5px;padding:6px 10px;border-radius:9px;border:1.5px solid var(--c);background:transparent;color:var(--c);font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
.nextbtn:hover{background:var(--c);color:#fff}
/* ===== التفاصيل ===== */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dbox{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:var(--paper)}
.dbox h4{margin:0 0 8px;font-size:13px}
.dbox .field{margin-bottom:9px}.dbox .field label{font-size:11.5px}
.items{width:100%;border-collapse:collapse;font-size:13px}.items td,.items th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}.items th{font-size:11.5px;color:var(--muted)}
.items .n{text-align:left;white-space:nowrap}
.tot{margin-top:8px;font-size:13px}.tot div{display:flex;justify-content:space-between;padding:3px 0}.tot .g{font-size:16px;font-weight:800;border-top:1px solid var(--line);margin-top:4px;padding-top:7px}
.tl{list-style:none;margin:0;padding:0}.tl li{position:relative;padding:0 22px 14px 0;font-size:13px}
.tl li::before{content:"";position:absolute;right:5px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.tl li::after{content:"";position:absolute;right:10px;top:19px;bottom:-3px;width:2px;background:var(--line)}.tl li:last-child::after{display:none}
.tl .m{color:var(--muted);font-size:11.5px}.tl .nt{background:var(--soft);border-radius:9px;padding:6px 10px;margin-top:4px}
.stpick{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.stopt{display:flex;align-items:center;gap:9px;padding:7px 10px;border:1.5px solid var(--line);border-radius:11px;cursor:pointer}
.stopt:has(input:checked){border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,transparent)}
.stopt small{margin-right:auto;color:var(--muted);font-size:11px}
.stopt input{accent-color:var(--green2)}
.sm-row{border:1px solid var(--line);border-radius:13px;padding:10px;margin-bottom:9px;background:var(--paper)}
.sm-row .r1{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.sm-row input[type=text]{flex:1;min-width:120px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-family:inherit}
.sm-row input[type=color]{width:38px;height:36px;padding:2px;border:1.5px solid var(--line);border-radius:9px;background:none}
.sm-row select{padding:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-family:inherit}
.sm-row .r2{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12.5px}
.sm-row textarea{width:100%;margin-top:8px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:12.5px;min-height:46px}
/* ===== الماسح ===== */
.scanbox{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:4/3;max-height:46vh}
.scanbox video{width:100%;height:100%;object-fit:cover}
.scanframe{position:absolute;inset:18% 12%;border:3px solid rgba(255,255,255,.85);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scanframe::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:#ff4d4d;animation:scan 1.6s ease-in-out infinite}
@keyframes scan{0%,100%{top:12%}50%{top:88%}}
.scanlog{max-height:120px;overflow:auto;margin-top:10px;font-size:12.5px}.scanlog div{padding:3px 0;border-bottom:1px dashed var(--line)}
.invframe{width:100%;height:62vh;border:1px solid var(--line);border-radius:12px;background:#fff}
.pager{text-align:center;margin-top:14px}
@media(max-width:760px){.dgrid{grid-template-columns:1fr}.ot .hide-m{display:none}.stn{flex-basis:84px;min-width:84px}}
</style>
</head>
<body data-theme="light">
<div id="app"></div>

<script type="module">
import * as C from './weshah-core.js';
import * as A from './weshah-accounting.js';
import * as K from './weshah-codes.js';

/* ---- حماية من اختلاف إصدارات الملفات (كاش قديم / ملف لم يُرفع) ---- */
const FS_URL = 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const { $, $$, esc, svg, mountShell, getConfig, saveConfig, getSession, openModal, confirmDialog, toast, download, debounce,
  db, collection, getDocs, getDoc, doc, updateDoc, deleteDoc, writeBatch, serverTimestamp, getImageDataUrl, LOGO_FALLBACK } = C;
const runTransaction = C.runTransaction || (await import(FS_URL)).runTransaction;
const { qrSvg, barcodeSvg, code128Valid } = K;
const ORDER_STATUSES = C.ORDER_STATUSES || ['pending', 'processing', 'shipped', 'completed', 'cancelled', 'refunded'];
const DEFAULT_ORDER_FLOW = C.DEFAULT_ORDER_FLOW || [
  { id: 'st_new', name: 'جديد', color: '#7b8794', status: 'pending' },
  { id: 'st_confirmed', name: 'تم التأكيد', color: '#2f80ed', status: 'processing' },
  { id: 'st_prep', name: 'قيد التجهيز', color: '#8e5bd6', status: 'processing' },
  { id: 'st_carrier', name: 'سُلّم لشركة الشحن', color: '#f2994a', status: 'shipped', msg: 'تم تسليم طلبك {number} لشركة الشحن وسيصلك قريبًا.' },
  { id: 'st_transit', name: 'في الطريق إليك', color: '#d9a21b', status: 'shipped' },
  { id: 'st_delivered', name: 'تم التسليم للعميل', color: '#1a8a5a', status: 'completed', msg: 'تم تسليم طلبك {number}. شكرًا لثقتك {name} 💚' },
  { id: 'st_returned', name: 'رجع من شركة الشحن', color: '#c0504a', status: 'refunded', restock: true, branch: true, msg: 'نأسف {name}، شركة الشحن أعادت طلبك {number}. سنتواصل معك لإعادة الشحن.' },
  { id: 'st_cancelled', name: 'مرفوض / ملغي', color: '#6c7871', status: 'cancelled', restock: true, branch: true }
];
const normalizeFlow = C.normalizeFlow || (raw => {
  if (!Array.isArray(raw) || raw.length < 2) return DEFAULT_ORDER_FLOW.map(x => ({ ...x }));
  const seen = new Set(), out = [];
  raw.forEach(x => { if (!x || !x.id || seen.has(x.id)) return; seen.add(x.id); out.push({ id: String(x.id), name: String(x.name || 'محطة').slice(0, 40), color: /^#[0-9a-f]{6}$/i.test(x.color || '') ? x.color : '#7b8794', status: ORDER_STATUSES.includes(x.status) ? x.status : 'processing', restock: !!x.restock, branch: !!x.branch, msg: String(x.msg || '').slice(0, 300) }); });
  return out.length >= 2 ? out : DEFAULT_ORDER_FLOW.map(x => ({ ...x }));
});

/* ---- شريط أخطاء ظاهر بدل الصفحة البيضاء ---- */
function showFatal(msg) {
  let bar = document.getElementById('fatal');
  if (!bar) { bar = document.createElement('div'); bar.id = 'fatal'; bar.style.cssText = 'position:fixed;top:0;right:0;left:0;z-index:9999;background:#b95d50;color:#fff;padding:10px 14px;font:13px/1.6 system-ui,sans-serif;direction:rtl'; document.body.appendChild(bar); }
  bar.innerHTML = `⚠️ ${String(msg).replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]))} <button type="button" style="margin-right:10px;border:0;border-radius:8px;padding:3px 10px" onclick="this.parentNode.remove()">إخفاء<\/button>`;
}
window.addEventListener('error', e => { if (e.message && !/ResizeObserver/.test(e.message)) showFatal(e.message); });
window.addEventListener('unhandledrejection', e => showFatal(e.reason?.message || e.reason));

const page = mountShell({
  title: 'الطلبات',
  sub: 'متابعة الطلبات وتتبّعها على شريط المحطات وطباعة الفواتير',
  tools: `<button class="icon-btn" type="button" data-act="reload" title="تحديث" aria-label="تحديث">${svg('refresh')}<\/button>`
});

/* ================= أدوات ================= */
const num = v => { const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x660)); return Number.isFinite(n) ? n : 0; };
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const cur = () => getConfig().accounting.currency || 'ج.م';
const m = n => A.fmtMoney(n, cur());
const nfDate = new Intl.DateTimeFormat('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });
const fmtDT = ms => (ms ? nfDate.format(new Date(ms)) : '—');
const toMs = v => { const d = A.toDate(v); return d ? d.getTime() : (typeof v === 'number' ? v : 0); };
const latin = s => String(s ?? '').replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x660).replace(/[۰-۹]/g, d => d.charCodeAt(0) - 0x6F0);
const compact = s => latin(s).toLowerCase().replace(/[^a-z0-9؀-ۿ]/g, '');
let localFlow = null;
const flow = () => getConfig().orderFlow || localFlow || DEFAULT_ORDER_FLOW;
const stById = id => flow().find(s => s.id === id);
const PAGE_SIZE = 30;

/* ================= الحالة ================= */
const store = { orders: [], errors: {} };
const ui = { q: '', station: '', range: 'all', sort: 'new', shown: PAGE_SIZE, sel: new Set(), loaded: false, seen: null };
try { Object.assign(ui, JSON.parse(localStorage.getItem('weshah-orders-ui') || '{}'), { q: '', sel: new Set(), shown: PAGE_SIZE, loaded: false, seen: null }); } catch (_) {}
const saveUi = () => { try { localStorage.setItem('weshah-orders-ui', JSON.stringify({ station: ui.station, range: ui.range, sort: ui.sort })); } catch (_) {} };

/* ================= تطبيع الطلبات ================= */
let O = [], byId = new Map();
function normOrder(d) {
  const items = (Array.isArray(d.items) ? d.items : []).filter(Boolean).map(i => ({ productId: i.productId || '', name: String(i.name || 'منتج'), qty: Math.max(0, num(i.qty) || 1), price: num(i.price), color: i.color || '', size: i.size || '' }));
  const sum = r2(items.reduce((s, i) => s + i.qty * i.price, 0));
  const subtotal = d.subtotal != null ? num(d.subtotal) : sum, discount = num(d.discount), shipping = num(d.shipping);
  const total = d.total != null ? num(d.total) : r2(subtotal - discount + shipping);
  const number = String(d.orderNumber || d.number || d.id.slice(0, 10).toUpperCase());
  const status = ORDER_STATUSES.includes(d.status) ? d.status : 'pending';
  return {
    id: d.id, raw: d, number, items, subtotal, discount, shipping, total, status, coupon: d.couponCode || d.coupon || '',
    customer: String(d.customerName || d.customer || d.name || 'عميل'), phone: String(d.phone || ''), city: d.city || '', address: d.address || '', notes: d.notes || '',
    payment: d.paymentMethod || 'cod', created: toMs(d.createdAt), stage: d.stage || '', restocked: !!d.restocked,
    timeline: Array.isArray(d.timeline) ? d.timeline.filter(Boolean) : [], shipCompany: d.shipCompany || '', trackingNo: d.trackingNo || '', adminNote: d.adminNote || '',
    qty: items.reduce((s, i) => s + i.qty, 0)
  };
}
function stationOf(o) {
  const f = flow(), s = f.find(x => x.id === o.stage);
  if (s && s.status === o.status) return s;
  return f.find(x => x.status === o.status && !x.branch) || f.find(x => x.status === o.status) || f[0];
}
function nextStation(o) {
  const f = flow().filter(x => !x.branch), cur = stationOf(o);
  const i = f.findIndex(x => x.id === cur.id);
  return i >= 0 && i < f.length - 1 ? f[i + 1] : null;
}
function derive() { O = store.orders.map(normOrder); byId = new Map(O.map(o => [o.id, o])); ui.sel = new Set([...ui.sel].filter(id => byId.has(id))); }

/* ================= التحميل ================= */
async function load(silent) {
  if (!getConfig().orderFlow && !localFlow) { try { const sn = await getDoc(doc(db, 'settings', 'site')); if (sn.exists() && sn.data().orderFlow) localFlow = normalizeFlow(sn.data().orderFlow); } catch (_) {} }
  try {
    const snap = await getDocs(collection(db, 'orders'));
    store.orders = snap.docs.map(d => ({ id: d.id, ...d.data() })); delete store.errors.orders;
  } catch (e) { store.errors.orders = e.code || e.message; console.warn('orders', e); if (!silent) store.orders = []; }
  derive();
  if (ui.seen && silent) { const fresh = O.filter(o => !ui.seen.has(o.id)); if (fresh.length) { toast(`🛎 ${fresh.length} طلب جديد: ${fresh.map(o => o.number).slice(0, 2).join('، ')}`); beep(880, 160); } }
  ui.seen = new Set(O.map(o => o.id)); ui.loaded = true; render();
}
setInterval(() => { if (!document.hidden && ui.loaded) load(true); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && ui.loaded) load(true); });

/* ================= البحث والتصفية ================= */
function phoneKey(p) { return latin(p).replace(/\D/g, ''); }
function matches(o, q) {
  const raw = latin(q).trim().toLowerCase(); if (!raw) return true;
  const hay = [o.number, o.customer, o.phone, o.city, o.address, o.trackingNo, o.shipCompany, o.coupon, o.id, ...o.items.map(i => i.name)].join(' ').toLowerCase();
  const words = raw.split(/\s+/).filter(Boolean);
  if (words.every(w => hay.includes(w))) return true;
  const c = compact(raw); if (c && (compact(o.number).includes(c) || compact(o.trackingNo).includes(c))) return true;
  const d = phoneKey(raw); if (d.length >= 6 && phoneKey(o.phone).endsWith(d.slice(-9))) return true;
  return false;
}
function rangeStart() {
  const now = new Date(), d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  return { today: d0, '7d': d0 - 6 * 864e5, '30d': d0 - 29 * 864e5, month: new Date(now.getFullYear(), now.getMonth(), 1).getTime(), all: 0 }[ui.range] || 0;
}
function view() {
  const st = rangeStart();
  let l = O.filter(o => (!st || o.created >= st) && (!ui.station || stationOf(o).id === ui.station) && matches(o, ui.q));
  const by = { new: (a, b) => b.created - a.created, old: (a, b) => a.created - b.created, total: (a, b) => b.total - a.total, name: (a, b) => a.customer.localeCompare(b.customer, 'ar') }[ui.sort];
  return l.sort(by);
}
/** تطابق دقيق لقيمة ممسوحة من باركود/QR */
function matchCode(code) {
  const raw = String(code || '').trim(); if (!raw) return null;
  const c = compact(raw);
  return O.find(o => o.id === raw || compact(o.number) === c || (o.trackingNo && compact(o.trackingNo) === c))
    || O.find(o => compact(o.number).length >= 5 && c.includes(compact(o.number))) || null;
}
window.WESHAH_ORDERS = { matchCode, get orders() { return O; } };

/* ================= الصوت والتنبيهات ================= */
let actx; function beep(freq = 1200, ms = 90) { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = freq; o.connect(g); g.connect(actx.destination); g.gain.value = .08; o.start(); setTimeout(() => o.stop(), ms); } catch (_) {} }

/* ================= العرض ================= */
const schip = s => `<span class="schip" style="--c:${esc(s.color)}">${esc(s.name)}<\/span>`;
const kpi = (icon, label, value, sub = '') => `<div class="kpi"><div class="k-top"><div class="k-icon">${svg(icon)}<\/div><\/div><div class="k-label">${label}<\/div><div class="k-value num">${value}<\/div>${sub ? `<div class="k-sub">${sub}<\/div>` : ''}<\/div>`;

function trainHTML(counts) {
  const f = flow(), main = f.filter(s => !s.branch), br = f.filter(s => s.branch);
  const total = O.length;
  const node = (s, i, extra = '') => `<button type="button" class="stn ${ui.station === s.id ? 'on' : ''} ${extra}" style="--c:${esc(s.color)}" data-act="stn" data-id="${esc(s.id)}" title="${esc(s.name)} — اضغط للتصفية"><i class="dot num">${counts.get(s.id) || 0}<\/i><b>${esc(s.name)}<\/b><\/button>`;
  return `<div class="train" role="list">
    <button type="button" class="stn ${!ui.station ? 'on' : ''}" style="--c:#0b4a33" data-act="stn" data-id=""><i class="dot num">${total}<\/i><b>كل الطلبات<\/b><\/button>
    ${main.map((s, i) => node(s, i)).join('')}${br.length ? `<div class="stn sep" aria-hidden="true"><\/div>${br.map(s => node(s, 0, 'branch')).join('')}` : ''}<\/div>`;
}

function render() {
  if (!ui.loaded) { page.innerHTML = `<div class="kpis">${'<div class="skeleton"><\/div>'.repeat(4)}<\/div><div class="skeleton" style="min-height:300px"><\/div>`; return; }

/* ================= نقل الطلبات بين المحطات ================= */
const fill = (tpl, o) => String(tpl || '').replace(/\{name\}/g, o.customer).replace(/\{number\}/g, o.number).replace(/\{total\}/g, m(o.total));
async function stockAdjust(o, sign) {
  const by = new Map(); o.items.forEach(i => { if (i.productId && i.qty) by.set(i.productId, [...(by.get(i.productId) || []), i]); });
  let failed = 0;
  for (const [pid, ls] of by) {
    try {
      await runTransaction(db, async tx => {
        const ref = doc(db, 'products', pid), snap = await tx.get(ref); if (!snap.exists()) return;
        const d = snap.data(); if (d.trackStock === false) return;
        const upd = {};
        if (Array.isArray(d.variants) && d.variants.length) {
          const vs = d.variants.map(v => ({ ...v }));
          ls.forEach(l => { const v = vs.find(x => (x.color || '') === l.color && (x.size || '') === l.size); if (v) v.stock = Math.max(0, num(v.stock) + sign * l.qty); });
          upd.variants = vs; upd.stock = vs.reduce((a, v) => a + num(v.stock), 0);
        } else if (d.stock !== null && d.stock !== undefined) upd.stock = Math.max(0, num(d.stock) + sign * ls.reduce((a, l) => a + l.qty, 0));
        if (Object.keys(upd).length) tx.update(ref, upd);
      });
    } catch (e) { failed++; console.warn('stock', pid, e); }
  }
  return failed;
}
async function moveOrders(ids, station, note = '', pub = false) {
  const user = getSession()?.user || '';
  let moved = 0, skipped = 0, stockFail = 0; const queued = [];
  for (const id of ids) {
    const o = byId.get(id); if (!o) continue;
    if (stationOf(o).id === station.id && !note) { skipped++; continue; }
    const need = station.restock && !o.restocked ? 1 : (!station.restock && o.restocked ? -1 : 0);
    if (need) stockFail += await stockAdjust(o, need);
    const text = fill(note, o).trim(), at = Date.now();
    const entry = { stage: station.id, name: station.name, status: station.status, at, note: text, public: !!(pub && text), by: user };
    const timeline = [...o.timeline, entry].slice(-120);
    const data = { stage: station.id, stageName: station.name, status: station.status, stageAt: at, timeline, restocked: need ? need > 0 : o.restocked, customerNote: pub && text ? text : '', updatedAt: serverTimestamp() };
    queued.push([id, data]);
  }
  for (let i = 0; i < queued.length; i += 400) {
    const b = writeBatch(db); queued.slice(i, i + 400).forEach(([id, d]) => b.update(doc(db, 'orders', id), d)); await b.commit();
  }
  queued.forEach(([id, d]) => { const rec = store.orders.find(x => x.id === id); if (rec) { const { updatedAt, ...rest } = d; Object.assign(rec, rest); } moved++; });
  derive();
  return { moved, skipped, stockFail };
}

/* ================= الماسح (كاميرا) ================= */
let jsQRp = null;
const loadJsQR = () => jsQRp || (jsQRp = new Promise((res, rej) => { if (window.jsQR) return res(window.jsQR); const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; s.onload = () => res(window.jsQR); s.onerror = () => rej(new Error('jsqr')); document.head.appendChild(s); }));
async function openScanner() {
  openModal({ title: 'مسح باركود / QR', hideSave: true, cancelLabel: 'إغلاق',
    body: `<div class="scanbox"><video id="scanVideo" playsinline muted><\/video><div class="scanframe"><\/div><\/div>
      <label class="check-row" style="margin-top:10px"><input type="checkbox" id="scanMulti" checked> وضع التحديد المتتابع — كل طلب يُمسح يُضاف للتحديد (لنقل عدة طلبات دفعة واحدة)<\/label>
      <div class="field" style="margin-top:10px;margin-bottom:0"><input id="scanManual" placeholder="أو اكتب / امسح بجهاز قارئ باركود ثم Enter" dir="ltr" style="text-align:right" autocomplete="off"><\/div>
      <div class="muted" id="scanMsg" style="font-size:12px;margin-top:6px"><\/div><div class="scanlog" id="scanLog"><\/div>` });
  const video = $('#scanVideo'), msg = $('#scanMsg'), log = $('#scanLog'); let last = '', lastT = 0, stream = null, stop = false;
  const logLine = (ok, t) => { log.insertAdjacentHTML('afterbegin', `<div class="${ok ? 'pos' : 'neg'}">${ok ? '✓' : '✗'} ${esc(t)}<\/div>`); };
  const onCode = code => {
    code = String(code || '').trim(); if (!code) return;
    const now = Date.now(); if (code === last && now - lastT < 2500) return; last = code; lastT = now;
    const o = matchCode(code);
    if (!o) { beep(300, 220); logLine(false, `غير معروف: ${code.slice(0, 40)}`); return; }
    beep(1300, 80); try { navigator.vibrate && navigator.vibrate(60); } catch (_) {}
    if ($('#scanMulti')?.checked) { ui.sel.add(o.id); logLine(true, `${o.number} — ${o.customer} (محدد: ${ui.sel.size})`); render(); }
    else { stop = true; $('#appModal [data-cancel]')?.click(); ui.q = o.number; render(); openDetail(o.id); }
  };
  $('#scanManual').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); onCode(e.target.value); e.target.value = ''; } });
  $('#scanManual').focus();
  if (!navigator.mediaDevices?.getUserMedia) { msg.textContent = 'الكاميرا غير متاحة في هذا المتصفح (تحتاج HTTPS). يمكنك الكتابة أو استخدام قارئ باركود.'; return; }
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false }); }
  catch (e) { msg.textContent = 'تعذّر فتح الكاميرا — اسمح بالوصول للكاميرا من إعدادات المتصفح.'; return; }
  video.srcObject = stream; await video.play().catch(() => {});
  let detector = null, jsqr = null;
  if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code', 'code_128', 'ean_13', 'code_39'] }); } catch (_) {} }
  if (!detector) { try { jsqr = await loadJsQR(); msg.textContent = 'هذا المتصفح يدعم قراءة QR فقط (للباركود الخطي استخدم Chrome أو قارئ باركود).'; } catch (_) { msg.textContent = 'تعذّر تحميل قارئ QR — اكتب الرقم يدويًا.'; } }
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
  const tick = async () => {
    if (stop || !video.isConnected) { stream.getTracks().forEach(t => t.stop()); return; }
    try {
      if (video.readyState >= 2) {
        if (detector) { const r = await detector.detect(video); r.forEach(x => onCode(x.rawValue)); }
        else if (jsqr) { cv.width = video.videoWidth; cv.height = video.videoHeight; cx.drawImage(video, 0, 0); const id = cx.getImageData(0, 0, cv.width, cv.height); const r = jsqr(id.data, id.width, id.height); if (r) onCode(r.data); }
      }
    } catch (_) {}
    setTimeout(tick, 160);
  };
  tick();
}

let rec = null;
function toggleMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; const btn = $('#micBtn');
  if (!SR) return toast('البحث الصوتي غير مدعوم في هذا المتصفح (استخدم Chrome)', 'error');
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = 'ar-EG'; rec.interimResults = false; rec.maxAlternatives = 3;
  btn?.classList.add('rec'); toast('🎤 تحدّث الآن… قل رقم الطلب أو اسم العميل');
  rec.onresult = e => {
    let t = latin(e.results[0][0].transcript).trim();
    if (/\d/.test(t)) t = t.replace(/(?<=\d)\s+(?=\d)/g, '');
    t = t.replace(/[.،,؟?]+$/g, '');
    ui.q = t; ui.shown = PAGE_SIZE; render(); toast(`سمعت: «${t}»`);
    const exact = matchCode(t); if (exact && view().length === 1) beep(1300, 80);
  };
  rec.onerror = e => { toast(e.error === 'not-allowed' ? 'اسمح باستخدام الميكروفون' : 'لم أسمع جيدًا — حاول مرة أخرى', 'error'); };
  rec.onend = () => { rec = null; $('#micBtn')?.classList.remove('rec'); };
  try { rec.start(); } catch (_) { rec = null; btn?.classList.remove('rec'); }
}

  'save-detail': async id => {
    const o = byId.get(id); if (!o) return;
    const d = { customerName: $('#eName').value.trim() || o.customer, phone: $('#ePhone').value.trim(), city: $('#eCity').value.trim(), address: $('#eAddr').value.trim(), shipCompany: $('#eCo').value.trim(), trackingNo: $('#eTrk').value.trim(), notes: $('#eNotes').value.trim(), adminNote: $('#eAdm').value.trim(), updatedAt: serverTimestamp() };
    await updateDoc(doc(db, 'orders', id), d); const rec = store.orders.find(x => x.id === id); const { updatedAt, ...rest } = d; Object.assign(rec, rest); derive(); toast('✓ تم حفظ بيانات الطلب'); render(); openDetail(id, true);
  },
  inv: id => openInvoices([id]),
  'inv-all': () => { const l = view(); if (!l.length) return toast('لا توجد طلبات', 'error'); if (l.length > 100 && !confirm(`ستُجهَّز ${l.length} فاتورة، متأكد؟`)) return; openInvoices(l.map(o => o.id)); },
  'bulk-inv': () => openInvoices(selIds()),
  'inv-print': () => printHTML(invState.html),
  'inv-size': async (id) => { await openInvoices(invState.ids, id); },
  'inv-dl': () => download(`invoice-${invState.ids.length === 1 ? (byId.get(invState.ids[0])?.number || 'x') : invState.ids.length + '-orders'}.html`, invState.html, 'text/html'),
  scan: () => openScanner(), mic: () => toggleMic(), stations: () => stationsModal(),
  csv: () => exportCsv(view()), 'bulk-csv': () => exportCsv(selIds().map(i => byId.get(i)).filter(Boolean)),
  'bulk-move': () => moveModal(selIds()),
  'bulk-next': async () => {
    const os = selIds().map(i => byId.get(i)).filter(Boolean); let n = 0, sf = 0;
    for (const o of os) { const nx = nextStation(o); if (nx) { const r = await moveOrders([o.id], nx); n += r.moved; sf += r.stockFail; } }
    toast(n ? `✓ تم تقديم ${n} طلب للمحطة التالية${sf ? ' (تعذّر تعديل بعض المخزون)' : ''}` : 'الطلبات المحددة في آخر محطة', n ? undefined : 'error'); render();
  },
  'bulk-del': async () => {
    const ids = selIds(); if (!await confirmDialog(`حذف ${ids.length} طلب نهائيًا؟ ستتأثر التقارير المحاسبية، ولن يُرجَع المخزون تلقائيًا.`, { okLabel: `حذف ${ids.length}` })) return;
    for (const id of ids) await deleteDoc(doc(db, 'orders', id));
    store.orders = store.orders.filter(o => !ids.includes(o.id)); ui.sel.clear(); derive(); toast('تم الحذف'); render();
  },
  'bulk-clear': () => { ui.sel.clear(); render(); }
};
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el || !act[el.dataset.act]) return;
  if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
  try { await act[el.dataset.act](el.dataset.id, el); } catch (err) { console.error(err); toast(err.message || 'حدث خطأ', 'error'); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'frange') { ui.range = t.value; saveUi(); ui.shown = PAGE_SIZE; return render(); }
  if (t.id === 'fsort') { ui.sort = t.value; saveUi(); return render(); }
  if (t.id === 'selAll') { view().slice(0, ui.shown).forEach(o => (t.checked ? ui.sel.add(o.id) : ui.sel.delete(o.id))); return render(); }
  if (t.dataset?.change === 'sel') { t.checked ? ui.sel.add(t.dataset.id) : ui.sel.delete(t.dataset.id); return render(); }
});
document.addEventListener('input', debounce(e => { if (e.target.id !== 'q') return; ui.q = e.target.value; ui.shown = PAGE_SIZE; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (_) {} }, 220));
document.addEventListener('keydown', e => {
  if (e.target.id === 'q' && e.key === 'Enter') { const o = matchCode(e.target.value); if (o) { e.preventDefault(); openDetail(o.id); } }
});
document.addEventListener('weshah:config-ready', () => ui.loaded && render());
document.addEventListener('weshah:config', () => ui.loaded && render());
render(); load();
</script>
</body>
</html>
