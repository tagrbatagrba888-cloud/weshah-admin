<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#073b29">
<meta name="description" content="متجر WESHAH — تسوّق بثقة: صور حقيقية، تقييمات العملاء، دفع عند الاستلام، وتوصيل سريع.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&display=swap">
<title>WESHAH — المتجر</title>
<style>
:root{
  --ink:#17251f;--muted:#6c7871;--green:#073b29;--green2:#15543d;--cream:#f7ebd5;--paper:#fffdf8;--line:#e8dfcf;--gold:#c9a45c;--gold2:#a07a2a;
  --red:#b95d50;--ok:#1a8a5a;--star:#f5a623;--soft:rgba(21,84,61,.06);--input:#fff;--shadow:0 14px 40px rgba(22,42,33,.10);--r:16px;
  --safe-b:env(safe-area-inset-bottom,0px);--hdr:64px;
}
body[data-theme="dark"]{
  --ink:#f2eadb;--muted:#b0ab9f;--green:#0a3b2b;--green2:#1b6247;--cream:#101d17;--paper:#17271f;--line:#2a3b31;--gold:#d0ad6b;--gold2:#e8c98a;
  --red:#e07f70;--ok:#4cc38a;--soft:rgba(45,122,90,.14);--input:#122119;--shadow:0 14px 40px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Alexandria',system-ui,sans-serif;font-size:14px;line-height:1.7;transition:background .3s,color .3s;min-height:100vh}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}[hidden]{display:none!important}
img{max-width:100%}
.ic{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-family:'DM Sans','Alexandria',sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}.pos{color:var(--ok)}.neg{color:var(--red)}
.btn{border:0;border-radius:12px;padding:12px 20px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s;line-height:1.3}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-p{background:var(--green);color:#fff}.btn-p:hover{background:var(--green2)}
body[data-theme="dark"] .btn-p{background:#1b6247}
.btn-g{background:var(--gold);color:#2a1f08}.btn-g:hover{filter:brightness(1.07)}
.btn-o{background:transparent;border:1.5px solid var(--line);color:var(--ink)}.btn-o:hover{border-color:var(--green2)}
.btn-block{width:100%}.btn-sm{padding:8px 14px;font-size:12.5px;border-radius:10px}
.input,select.input,textarea.input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;background:var(--input);color:var(--ink);font-family:inherit;font-size:14px;outline:none;transition:.2s}
.input:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(21,84,61,.14)}
.field{margin-bottom:13px}.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px}
.field.err .input{border-color:var(--red)}.field .em{display:none;color:var(--red);font-size:11.5px;margin-top:4px}.field.err .em{display:block}
.badge{display:inline-block;padding:2px 9px;border-radius:7px;font-size:11px;font-weight:700}
.b-red{background:var(--red);color:#fff}.b-gold{background:var(--gold);color:#2a1f08}.b-green{background:rgba(26,138,90,.15);color:var(--ok)}.b-gray{background:rgba(120,132,125,.18);color:var(--muted)}

/* نجوم */
.stars{position:relative;display:inline-block;direction:rtl;font-size:15px;letter-spacing:1px;line-height:1;color:var(--line);white-space:nowrap}
.stars::before{content:'★★★★★'}
.stars b{position:absolute;top:0;right:0;width:var(--p,0%);overflow:hidden;white-space:nowrap;color:var(--star);font-weight:400}
.stars b::before{content:'★★★★★'}
.stars.lg{font-size:22px}

/* الشريط العلوي */
.ann{background:var(--green);color:#f7ebd5;text-align:center;font-size:12.5px;padding:7px 14px}
.ann b{color:var(--gold)}
header.hdr{position:sticky;top:0;z-index:60;background:var(--green);color:#f7ebd5;box-shadow:0 2px 14px rgba(0,0,0,.18)}
body[data-theme="dark"] header.hdr{background:#0a2c20}
.hdr-in{display:flex;align-items:center;gap:14px;height:var(--hdr)}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand img{height:42px;width:42px;object-fit:contain;border-radius:9px;background:rgba(255,255,255,.06)}
.brand span{font-family:'DM Sans',sans-serif;font-weight:800;letter-spacing:2px;font-size:20px;line-height:1}
.brand small{display:block;font-family:'Alexandria';font-size:7.5px;letter-spacing:2.4px;color:var(--gold);font-weight:500;margin-top:3px}
.search{flex:1;position:relative;max-width:720px}
.search form{display:flex;background:#fff;border-radius:12px;overflow:hidden}
body[data-theme="dark"] .search form{background:#122119}
.search input{flex:1;border:0;outline:0;padding:11px 14px;font-family:inherit;font-size:14px;background:transparent;color:var(--ink);min-width:0}
.search button{border:0;background:var(--gold);color:#2a1f08;padding:0 18px;display:grid;place-items:center}
.sugg{position:absolute;top:calc(100% + 6px);right:0;left:0;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;z-index:70}
.sugg a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-bottom:1px solid var(--line)}
.sugg a:last-child{border:0}.sugg a:hover,.sugg a.on{background:var(--soft)}
.sugg img{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--soft)}
.sugg .t{flex:1;min-width:0;font-size:13px}.sugg .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-actions{display:flex;gap:6px;margin-right:auto}
.hbtn{position:relative;background:transparent;border:0;color:inherit;padding:8px 10px;border-radius:11px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:600}
.hbtn:hover{background:rgba(255,255,255,.1)}
.hbtn .cnt{position:absolute;top:0;left:2px;background:var(--gold);color:#2a1f08;border-radius:20px;min-width:19px;height:19px;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.catbar{background:var(--paper);border-bottom:1px solid var(--line)}
.catbar .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:9px;padding-bottom:9px;scrollbar-width:none}
.catbar .wrap::-webkit-scrollbar{display:none}
.cchip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 15px;border-radius:30px;font-size:13px;font-weight:600;transition:.15s}
.cchip:hover{border-color:var(--green2)}.cchip.on{background:var(--green);border-color:var(--green);color:#fff}
body[data-theme="dark"] .cchip.on{background:#1b6247;border-color:#1b6247}

/* الهيرو */
.hero{position:relative;margin:18px 0;border-radius:24px;overflow:hidden;background:linear-gradient(120deg,#0b4a33,#05291e);color:#f7ebd5;min-height:300px}
.slide{display:none;grid-template-columns:1.1fr .9fr;align-items:center;gap:20px;padding:34px 44px;min-height:300px;animation:fade .5s}
.slide.on{display:grid}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.slide .eyebrow{color:var(--gold);font-size:12px;letter-spacing:2px;font-weight:700}
.slide h2{font-size:clamp(24px,3.4vw,40px);line-height:1.4;margin:8px 0 10px;font-weight:700}
.slide p{color:#d8e4d6;max-width:440px;margin:0 0 18px;font-size:14px;line-height:1.9}
.slide .pr{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}.slide .pr b{font-size:28px}.slide .pr s{opacity:.65}
.slide .pic{height:250px;border-radius:20px;overflow:hidden;background:rgba(255,255,255,.07);display:grid;place-items:center}
.slide .pic img{width:100%;height:100%;object-fit:cover}
.dots{position:absolute;bottom:14px;right:50%;transform:translateX(50%);display:flex;gap:7px}
.dots button{width:9px;height:9px;border-radius:50%;border:0;background:rgba(247,235,213,.4);padding:0}.dots button.on{background:var(--gold);width:24px;border-radius:9px}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.trust div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:11px;font-size:12.5px}
.trust .ic{width:26px;height:26px;color:var(--green2)}body[data-theme="dark"] .trust .ic{color:#9ad6b8}
.trust b{display:block;font-size:13px}

/* الأقسام */
.sec{margin:26px 0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
.sec-h h2{font-size:19px;margin:0;font-weight:700}.sec-h a,.sec-h button{font-size:13px;color:var(--green2);font-weight:700;background:none;border:0}
body[data-theme="dark"] .sec-h a,body[data-theme="dark"] .sec-h button{color:#9ad6b8}
.rail{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity;scrollbar-width:thin}
.rail .pc{flex:0 0 220px;scroll-snap-align:start}

/* بطاقة المنتج */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:.2s;position:relative}
.pc:hover{box-shadow:var(--shadow);transform:translateY(-3px)}
.pc .im{position:relative;aspect-ratio:1;background:var(--soft);display:block;overflow:hidden}
.pc .im img{width:100%;height:100%;object-fit:cover;transition:transform .4s}.pc:hover .im img{transform:scale(1.05)}
.pc .im .ph{display:grid;place-items:center;height:100%;color:var(--muted)}
.pc .tags{position:absolute;top:9px;right:9px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.pc .heart{position:absolute;top:8px;left:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#444;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.pc .heart.on{color:#d9435a}.pc .heart.on .ic{fill:#d9435a}
.pc .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.pc .cat{font-size:11.5px;color:var(--muted)}
.pc h3{margin:0;font-size:14px;line-height:1.6;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:44px}
.pc .rt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.pc .pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.pc .pr b{font-size:18px}.pc .pr s{color:var(--muted);font-size:12.5px}
.pc .dots2{display:flex;gap:5px;align-items:center}.pc .dots2 i{width:15px;height:15px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
.pc .add{margin-top:auto}
.pc.sold .im img{opacity:.45;filter:grayscale(.6)}

/* التصفية */
.shop{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:start}
.filters{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:sticky;top:calc(var(--hdr) + 14px)}
.filters h4{margin:16px 0 8px;font-size:13.5px}.filters h4:first-child{margin-top:0}
.fl{display:flex;flex-direction:column;gap:6px}
.fl label{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.fl input{accent-color:var(--green);width:16px;height:16px}
.prange{display:flex;gap:8px;align-items:center}.prange input{width:100%;padding:8px 10px}
.cdots{display:flex;gap:8px;flex-wrap:wrap}.cdots button{width:28px;height:28px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line);padding:0}.cdots button.on{box-shadow:0 0 0 2px var(--green2)}
.tb{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tb .cnt{font-size:13px;color:var(--muted)}
.fbtn{display:none}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}.empty .ic{width:56px;height:56px;opacity:.35}.empty h3{color:var(--ink);margin:10px 0 4px}
.skel{background:linear-gradient(90deg,var(--soft),rgba(120,132,125,.2),var(--soft));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r)}
@keyframes sk{to{background-position:-200% 0}}

/* صفحة المنتج */
.crumbs{font-size:12.5px;color:var(--muted);margin:16px 0;display:flex;gap:7px;flex-wrap:wrap;align-items:center}.crumbs a:hover{color:var(--green2);text-decoration:underline}
.pdp{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) 300px;gap:26px;align-items:start}
.gal{display:grid;grid-template-columns:70px 1fr;gap:12px}
.gal .th{display:flex;flex-direction:column;gap:9px;max-height:520px;overflow:auto}
.gal .th button{border:2px solid var(--line);border-radius:12px;padding:0;overflow:hidden;aspect-ratio:1;background:var(--soft)}.gal .th button.on{border-color:var(--gold)}
.gal .th img{width:100%;height:100%;object-fit:cover;display:block}
.gal .main{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--soft);border:1px solid var(--line);cursor:zoom-in}
.gal .main img{width:100%;height:100%;object-fit:contain;background:#fff;transition:transform .12s}
.gal .main.zoom img{transform:scale(2.1)}
.gal .nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#222;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.gal .nav.r{right:10px}.gal .nav.l{left:10px}
.gal .tg{position:absolute;top:12px;right:12px;display:flex;gap:6px}
.info h1{font-size:24px;line-height:1.5;margin:0 0 6px;font-weight:700}
.info .sub{color:var(--muted);font-size:13px}
.info .rt{display:flex;align-items:center;gap:9px;margin:8px 0;font-size:13px}.info .rt a{color:var(--green2);font-weight:600}
.info hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.pbig{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}.pbig b{font-size:32px;font-weight:800}.pbig s{color:var(--muted);font-size:16px}.pbig .sv{color:var(--red);font-weight:700;font-size:14px}
.opt h5{margin:14px 0 8px;font-size:13.5px}.opt h5 span{color:var(--muted);font-weight:500}
.swr{display:flex;gap:9px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 1.5px var(--line);padding:0;position:relative}.sw.on{box-shadow:0 0 0 2.5px var(--green2)}.sw:disabled{opacity:.35}
.szr button{min-width:48px;padding:8px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-weight:600}
.szr button.on{border-color:var(--green2);background:var(--soft);color:var(--green)}body[data-theme="dark"] .szr button.on{color:#9ad6b8}
.szr button:disabled{opacity:.4;text-decoration:line-through}
.bullets{margin:0;padding-right:20px;line-height:2}
.specs{width:100%;border-collapse:collapse;font-size:13.5px}.specs td{padding:9px 12px;border-bottom:1px solid var(--line)}.specs td:first-child{width:35%;background:var(--soft);font-weight:600}
.buybox{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:sticky;top:calc(var(--hdr) + 14px)}
.buybox .pp{font-size:26px;font-weight:800}
.buybox .st{font-weight:700;margin:6px 0}
.buybox .row{display:flex;gap:8px;align-items:center;margin:10px 0}
.buybox ul{list-style:none;margin:14px 0 0;padding:0;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:7px}.buybox ul li{display:flex;gap:8px;align-items:center}.buybox ul .ic{width:17px;height:17px;color:var(--ok)}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:11px;overflow:hidden}.qty button{border:0;background:var(--soft);width:36px;height:38px;font-size:18px;color:var(--ink)}.qty span{min-width:40px;text-align:center;font-weight:700}
.tabsx{display:flex;gap:6px;border-bottom:2px solid var(--line);margin:34px 0 18px;overflow-x:auto}
.tabsx button{border:0;background:none;padding:11px 18px;font-size:15px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}.tabsx button.on{color:var(--green);border-color:var(--gold)}body[data-theme="dark"] .tabsx button.on{color:#e8c98a}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px}

/* التقييمات */
.rv-top{display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:start}
.rv-sum .big{font-size:54px;font-weight:800;line-height:1}
.hist{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.hist button{display:flex;align-items:center;gap:9px;border:0;background:none;padding:2px 0;font-size:12.5px;color:var(--ink);width:100%}.hist button.on .tr{outline:2px solid var(--green2)}
.hist .tr{flex:1;height:10px;background:var(--soft);border-radius:10px;overflow:hidden}.hist .tr i{display:block;height:100%;background:var(--star)}
.rv{padding:16px 0;border-bottom:1px solid var(--line)}.rv:last-child{border:0}
.rv .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,#0b4a33,#05291e);color:#f7ebd5;display:grid;place-items:center;font-weight:700}
.rv h5{margin:4px 0;font-size:15px}.rv p{margin:4px 0 8px;line-height:1.9;white-space:pre-wrap}
.reply{background:var(--soft);border-right:3px solid var(--gold);border-radius:10px;padding:10px 14px;margin-top:8px;font-size:13px}
.helpful{font-size:12.5px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:20px;padding:4px 14px}.helpful.on{background:var(--soft);border-color:var(--green2)}
.starpick{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:2px}
.starpick button{background:none;border:0;font-size:30px;color:var(--line);padding:0 2px;line-height:1}.starpick button.on,.starpick button.on ~ button{color:var(--star)}
.starpick:hover button{color:var(--line)}.starpick button:hover,.starpick button:hover ~ button{color:var(--star)}

/* السلة والنوافذ */
.ov{position:fixed;inset:0;background:rgba(9,20,15,.55);z-index:90;opacity:0;pointer-events:none;transition:.25s;backdrop-filter:blur(2px)}.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(440px,100%);background:var(--paper);z-index:100;transform:translateX(-102%);transition:.3s,visibility .3s;visibility:hidden;display:flex;flex-direction:column}
.drawer.on{transform:none;visibility:visible;box-shadow:10px 0 40px rgba(0,0,0,.3)}
.dr-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}.dr-h h3{margin:0;font-size:18px}
.dr-b{flex:1;overflow-y:auto;padding:16px 20px}
.dr-f{padding:16px 20px calc(16px + var(--safe-b));border-top:1px solid var(--line);background:var(--paper)}
.x{border:0;background:var(--soft);width:36px;height:36px;border-radius:10px;color:var(--ink);display:grid;place-items:center}
.ci{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.ci .im{width:76px;height:76px;border-radius:12px;overflow:hidden;background:var(--soft)}.ci .im img{width:100%;height:100%;object-fit:cover}
.ci h4{margin:0 0 3px;font-size:13.5px;line-height:1.5}.ci .opts{font-size:12px;color:var(--muted)}
.ci .ctl{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.rmv{border:0;background:none;color:var(--red);font-size:12.5px;font-weight:600}
.sumr{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px}.sumr.t{font-size:17px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:11px}
.cpn{display:flex;gap:8px;margin:12px 0}
.cpmsg{font-size:12.5px;margin:-4px 0 8px}

async function restoreStock(pid, ls) {
  try {
    await runTransaction(db, async tx => {
      const ref = doc(db, 'products', pid), snap = await tx.get(ref); if (!snap.exists()) return;
      const d = snap.data(); if (d.trackStock === false) return;
      const upd = {};
      if (Array.isArray(d.variants) && d.variants.length) {
        const vs = d.variants.map(v => ({ ...v }));
        ls.forEach(l => { const v = vs.find(x => (x.color || '') === (l.color || '') && (x.size || '') === (l.size || '')); if (v) v.stock = num(v.stock) + l.qty; });
        upd.variants = vs; upd.stock = vs.reduce((a, v) => a + num(v.stock), 0);
      } else if (d.stock !== null && d.stock !== undefined) upd.stock = num(d.stock) + ls.reduce((a, l) => a + l.qty, 0);
      if (Object.keys(upd).length) tx.update(ref, upd);
    });
  } catch (e) { console.warn('rollback failed', pid, e); }
}
document.addEventListener('submit', async e => {
  if (e.target.id !== 'coForm') return; e.preventDefault();
  const name = $('#coName').value.trim(), phone = $('#coPhone').value.trim(), city = $('#coCity').value.trim(), address = $('#coAddr').value.trim(), notes = $('#coNotes').value.trim();
  const digits = phone.replace(/\D/g, '');
  const bad = { ckN: name.length < 2, ckP: digits.length < 10 || digits.length > 15, ckC: city.length < 2, ckA: address.length < 8 };
  Object.entries(bad).forEach(([k, v]) => $('#' + k).classList.toggle('err', v));
  if (Object.values(bad).some(Boolean)) return;
  const c = cartCalc(); if (!c.live.length) return;
  const btn = $('#coBtn'); btn.disabled = true; btn.textContent = 'جارٍ تأكيد الطلب...';
  const reserved = [], byLines = new Map();
  try {
    // 1) حجز المخزون بمعاملة آمنة لكل منتج (يمنع بيع ما نفد)
    const byP = byLines; c.live.forEach(l => { if (!byP.has(l.productId)) byP.set(l.productId, []); byP.get(l.productId).push(l); });
    for (const [pid, ls] of byP) {
      await runTransaction(db, async tx => {
        const ref = doc(db, 'products', pid), snap = await tx.get(ref); if (!snap.exists()) throw new Error(`المنتج «${ls[0].p.name}» لم يعد متاحًا`);
        const d = snap.data(); if (d.trackStock === false) return;
        const upd = {};
        if (Array.isArray(d.variants) && d.variants.length) {
          const vs = d.variants.map(v => ({ ...v })); let total = 0;
          ls.forEach(l => { const v = vs.find(x => (x.color || '') === (l.color || '') && (x.size || '') === (l.size || '')); if (!v || num(v.stock) < l.qty) throw new Error(`«${l.p.name}» ${[l.color, l.size].filter(Boolean).join(' ')} — الكمية المتاحة ${v ? num(v.stock) : 0} فقط`); v.stock = num(v.stock) - l.qty; });
          vs.forEach(v => { total += num(v.stock); }); upd.variants = vs; upd.stock = total;
        } else if (d.stock !== null && d.stock !== undefined) {
          const q = ls.reduce((s, l) => s + l.qty, 0); if (num(d.stock) < q) throw new Error(`«${ls[0].p.name}» — الكمية المتاحة ${num(d.stock)} فقط`); upd.stock = num(d.stock) - q;
        }
        if (Object.keys(upd).length) tx.update(ref, upd);
      });
      reserved.push(pid);
    }
    // 2) إنشاء الطلب
    const d0 = new Date(), number = `WS-${String(d0.getFullYear()).slice(2)}${String(d0.getMonth() + 1).padStart(2, '0')}${String(d0.getDate()).padStart(2, '0')}-${Math.floor(1000 + Math.random() * 9000)}`;
    const order = {
      orderNumber: number, customerName: name, phone: digits, address, city, notes,
      items: c.live.map(l => ({ productId: l.productId, name: l.p.name, category: l.p.category, qty: l.qty, price: l.unit, color: l.color || '', size: l.size || '' })),
      subtotal: c.subtotal, discount: c.discount, couponCode: c.couponOk ? c.coupon.code : '', shipping: c.shipping, total: c.total, paymentMethod: 'cod', status: 'pending', source: 'web', createdAt: serverTimestamp()
    };
    await addDoc(collection(db, 'orders'), order);
    // 3) عميل + استخدام الكوبون (لا يوقف الطلب عند الفشل)
    try { const cid = 'c_' + digits, cref = doc(db, 'customers', cid), cs = await getDoc(cref); const cd = { name, phone: digits, address, city, lastOrderAt: serverTimestamp(), ordersCount: increment(1) }; if (!cs.exists()) cd.createdAt = serverTimestamp(); await setDoc(cref, cd, { merge: true }); } catch (_) {}
    if (c.couponOk && c.coupon.id) { try { await updateDoc(doc(db, 'coupons', c.coupon.id), { used: increment(1) }); c.coupon.used++; } catch (_) {} }
    lsSet('weshah-cust', { name, phone: digits, city, address });
    const mine = lsGet('weshah-orders', []); lsSet('weshah-orders', [{ number, phone: digits }, ...mine].slice(0, 20));
    lastOrder = { number, name, phone: digits, total: c.total };
    c.live.forEach(l => { const p = S.byId.get(l.productId); if (!p || !p.track) return; const v = variantFor(p, l.color, l.size); if (v) v.stock = Math.max(0, v.stock - l.qty); p.stock = p.variants.length ? p.variants.reduce((s, x) => s + x.stock, 0) : Math.max(0, p.stock - l.qty); });
    S.cart = []; S.couponCode = ''; lsSet('weshah-coupon', ''); saveCart(); step = 'done'; drawCart(); render();
  } catch (err) {
    console.error(err);
    for (const pid of reserved) await restoreStock(pid, byLines.get(pid) || []);
    toast(err.message && !err.code ? err.message : 'تعذّر إتمام الطلب. حاول مرة أخرى.', true);
    btn.disabled = false; btn.innerHTML = `تأكيد الطلب · <span class="num">${money(c.total)}<\/span>`; await refreshProducts();
  }
});

async function init() {
  render();
  const [p, r, c, cfg] = await Promise.allSettled([getDocs(collection(db, 'products')), getDocs(collection(db, 'reviews')), getDocs(collection(db, 'coupons')), getDoc(doc(db, 'settings', 'site'))]);
  if (p.status === 'fulfilled') setProducts(p.value.docs.map(d => ({ id: d.id, ...d.data() })));
  if (r.status === 'fulfilled') { S.reviews = r.value.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => !x.hidden).map(x => ({ ...x, rating: Math.max(1, Math.min(5, Math.round(num(x.rating)))), date: toDate(x.createdAt) || new Date(0), helpful: Math.max(0, Math.round(num(x.helpful))) })); indexReviews(); }
  if (c.status === 'fulfilled') S.coupons = c.value.docs.map(d => normCoupon({ id: d.id, ...d.data() })).filter(x => x.code);
  if (cfg.status === 'fulfilled' && cfg.value.exists()) { const d = cfg.value.data(), sf = d.storefront || {};
    Object.assign(S.cfg, { siteNameEn: d.siteNameEn || 'WESHAH', logoImageId: d.logoImageId || '', logoUrl: d.logoUrl || '', currency: (d.accounting && d.accounting.currency) || 'ج.م',
      ship: sf.shippingFee !== undefined && sf.shippingFee !== '' ? num(sf.shippingFee) : 50, freeOver: sf.freeShippingOver !== undefined && sf.freeShippingOver !== '' ? num(sf.freeShippingOver) : 1000, phone: sf.phone || '', announcement: sf.announcement || '' }); }
  S.loaded = true; paintBrand(); render();
  if (p.status === 'rejected') $('#view').innerHTML = `<div class="empty">${ic('box')}<h3>تعذّر تحميل المنتجات<\/h3><div>تحقق من الاتصال أو من قواعد Firestore (القراءة على products).<\/div><\/div>`;
}
init();
</script>
</body>
</html>
