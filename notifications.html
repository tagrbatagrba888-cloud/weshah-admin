<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#073b29"><link rel="stylesheet" href="weshah.css"><title>وشاح | الإشعارات</title></head><body data-theme="light"><div id="app"></div><script type="module">
import {$,esc,mountShell} from './weshah-core.js';
const page=mountShell({title:'إشعارات وشاح',sub:'إرسال بموافقة الحساب والجهاز، مع معاينة وتأكيد قبل كل إرسال'});
page.innerHTML=`<div class="card" style="max-width:760px;margin:0 auto"><h2>إرسال إشعار</h2><p class="muted" style="line-height:1.9">نموذج شخصي للتجربة. الإرسال مقيّد بحساب اختبار واحد يحدده الخادم. لا يتم الإرسال تلقائيًا مع تغيير الطلب. إشعارات المنتجات تصل فقط للأجهزة التي اختارتها، وإشعار الطلب مرتبط بصاحب الطلب المسجّل.</p><div id="serviceState" role="status" class="muted">جارٍ التحقق من جلسة الإدارة...</div><form id="pushForm" hidden><div class="field"><label for="pushType">نوع الإشعار</label><select id="pushType" class="input"><option value="product">منتجات أو عروض جديدة</option><option value="confirmation">تأكيد طلب</option><option value="delivery">متابعة وموعد توصيل</option></select></div><div class="field" id="orderField" hidden><label for="pushOrder">معرّف الطلب الداخلي</label><input class="input" id="pushOrder" maxlength="128" dir="ltr" placeholder="Firestore order document ID"><small class="muted">يجب أن يكون الطلب مرتبطًا بحساب. لا يمكن إدخال رقم هاتف بدل الحساب.</small></div><div class="field"><label for="pushTitle">عنوان الإشعار</label><input class="input" id="pushTitle" maxlength="80" required value="وشاح"></div><div class="field"><label for="pushBody">نص الإشعار</label><textarea class="input" id="pushBody" maxlength="240" rows="4" required placeholder="اكتب النص الذي سيظهر على الجهاز"></textarea></div><button class="btn btn-primary" id="previewPush" type="submit">معاينة الجمهور والنص</button></form><section id="pushPreview" hidden style="margin-top:22px;border:1px solid var(--line);padding:18px;border-radius:16px"><h3>المعاينة قبل الإرسال</h3><p id="previewAudience"></p><div style="background:var(--soft);padding:15px;border-radius:12px"><strong id="previewTitle"></strong><p id="previewBody" style="white-space:pre-wrap;overflow-wrap:anywhere"></p></div><p class="muted" style="font-size:12px">المعاينة صالحة لدقيقتين فقط. القبول من مزوّد المتصفح لا يثبت أن الإشعار ظهر على الجهاز. لا تعِد الإرسال لمجرد أن الجهاز لم يعرضه فورًا.</p><label style="display:flex;gap:9px;margin:15px 0"><input type="checkbox" id="approvePush"> راجعت النص والجمهور وأوافق على الإرسال</label><button type="button" id="sendPush" class="btn btn-primary" disabled>تأكيد الإرسال</button></section><p id="pushResult" role="status" style="line-height:1.9;white-space:pre-wrap"></p></div>`;
let preview=null,busy=false,authenticated=false,sendingEnabled=false;
const state=$('#serviceState'),result=$('#pushResult'),form=$('#pushForm');
async function call(action,body){const r=await fetch('/api/push?action='+action,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,cache:'no-store',credentials:'same-origin'});let data;try{data=await r.json()}catch{throw Error('تعذّر الاتصال بخادم الإشعارات.')}if(!r.ok)throw Error(r.status===401?'انتهت جلسة الإدارة. سجّل الخروج ثم ادخل بنفس بياناتك.':r.status===409?'المعاينة انتهت أو تغيّر الجمهور أو أُرسل هذا الطلب بالفعل. راجع النتيجة قبل أي محاولة أخرى.':r.status===503?'الإرسال غير متاح حاليًا، أو لم يُفعّل بعد. لم تحدث إعادة محاولة تلقائية.':data.error||'تعذّر تنفيذ العملية.');return data;}
function values(){return {type:$('#pushType').value,orderId:$('#pushOrder').value.trim(),title:$('#pushTitle').value.trim(),body:$('#pushBody').value.trim()};}
function invalidate(){preview=null;$('#pushPreview').hidden=true;$('#approvePush').checked=false;$('#sendPush').disabled=true;$('#orderField').hidden=$('#pushType').value==='product';}
form.addEventListener('input',invalidate);form.addEventListener('change',invalidate);
$('#approvePush').onchange=()=>{$('#sendPush').disabled=!preview||!$('#approvePush').checked||busy||!sendingEnabled;};
form.onsubmit=async e=>{e.preventDefault();if(busy||!authenticated)return;busy=true;$('#previewPush').disabled=true;result.textContent='';try{const m=values();preview=await call('preview',m);$('#previewTitle').textContent=preview.message.title;$('#previewBody').textContent=preview.message.body;$('#previewAudience').textContent=preview.message.type==='product'?`الجمهور: ${preview.count} جهاز اختار إشعارات المنتجات والعروض.`:`الجمهور: ${preview.count} جهاز موافق لصاحب الطلب ${preview.message.orderId}.`;$('#approvePush').checked=false;$('#pushPreview').hidden=false;sendingEnabled=preview.sendingEnabled;$('#sendPush').disabled=true;if(!preview.count)result.textContent='لا توجد أجهزة موافقة لهذا الجمهور. لن يتم الإرسال.';else if(!sendingEnabled)result.textContent='الإرسال متوقف من إعدادات الخادم. المعاينة فقط متاحة.';}catch(err){result.textContent=err.message;invalidate();}finally{busy=false;$('#previewPush').disabled=false;}};
$('#sendPush').onclick=async()=>{if(!preview||busy||!$('#approvePush').checked||!sendingEnabled||!preview.count)return;busy=true;$('#sendPush').disabled=true;const token=preview.previewToken;preview=null;try{result.textContent='جارٍ الإرسال. لا تغلق الصفحة ولا تكرّر العملية.';const r=await call('send',{...values(),previewToken:token});result.textContent=`قبِل المزوّد: ${r.accepted}\nاشتراكات منتهية: ${r.expired}\nتعذّر إرسالها: ${r.failed}\nتغيّرت موافقتها فتُركت: ${r.skipped}\nالقبول ليس تأكيد ظهور. افحص الجهاز المطلوب.`;$('#pushPreview').hidden=true;}catch(err){result.textContent=err.message+' راجع الجهاز والنتيجة قبل إنشاء معاينة جديدة.';}finally{busy=false;}};
try{const s=await call('session');authenticated=s.authenticated;sendingEnabled=s.sendingEnabled;if(!authenticated){state.innerHTML='يلزم تسجيل الدخول بنفس حساب الإدارة لتفعيل الإرسال. <a href="login.html">تسجيل الدخول</a>';form.hidden=true;}else{state.textContent=sendingEnabled?'جلسة الإدارة مفعّلة. كل إرسال يحتاج معاينة وتأكيدًا.':'جلسة الإدارة مفعّلة. الإرسال متوقف حاليًا، والمعاينة فقط متاحة.';form.hidden=false;}}catch(err){state.textContent=err.message;}
</script></body></html>
