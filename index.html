<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#073b29">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WESHAH">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>WESHAH — لوحة التحكم</title>
<link rel="stylesheet" href="weshah.css">
</head>
<body data-theme="light">
<div id="app"></div>

<script type="module">
import {
  $, $$, esc, svg, COLORS, safeHref, getSession, mountShell, getConfig, hydrateImages, openModal, confirmDialog, toast,
  download, debounce, db, collection, getDocs, doc, addDoc, setDoc, updateDoc, deleteDoc, serverTimestamp, Timestamp
} from './weshah-core.js';
import * as A from './weshah-accounting.js';

const session = getSession();
const page = mountShell({
  title: `مرحبًا، <span>${esc(session?.user || '—')}</span> 👋`,
  sub: 'ملخص الأداء والمحاسبة الكامل للمتجر',
  tools: `<button class="icon-btn" type="button" data-act="reload" title="تحديث البيانات" aria-label="تحديث البيانات">${svg('refresh')}</button>`
});

/* ================= الحالة ================= */
const TABS = [
  ['overview', 'نظرة عامة', 'dashboard'], ['pnl', 'الأرباح والخسائر', 'chart'], ['orders', 'الطلبات', 'cart'],
  ['products', 'المنتجات والتكلفة', 'box'], ['expenses', 'المصروفات', 'receipt'], ['coupons', 'أكواد الخصم', 'percent'], ['feedback', 'التقييمات والأسئلة', 'star']
];
const RANGES = ['today', 'yesterday', '7d', '30d', 'month', 'lastMonth', 'year', 'all', 'custom'];
const EXPENSE_CATS = ['إيجار', 'رواتب وأجور', 'تسويق وإعلانات', 'شحن وتوصيل', 'مرافق وإنترنت', 'مشتريات وخامات', 'ضرائب ورسوم', 'صيانة', 'أخرى'];

const data = { products: [], orders: [], suppliers: [], customers: [], expenses: [], coupons: [], reviews: [], questions: [] };
const errors = {};
const ui = {
  tab: 'overview', range: 'month', from: '', to: '',
  orderStatus: 'all', orderQ: '', productQ: '', productSort: 'profit',
  loaded: false, loadedAt: 0, fbView: 'reviews'
};
try { ui.range = localStorage.getItem('weshah-range') || 'month'; ui.from = localStorage.getItem('weshah-from') || ''; ui.to = localStorage.getItem('weshah-to') || ''; } catch (_) {}
if (!RANGES.includes(ui.range)) ui.range = 'month';
let S = null;

const cfg = () => getConfig();
const cur = () => cfg().accounting.currency || 'ج.م';
const m = n => A.fmtMoney(n, cur());
const pc = A.fmtPct;
const toNoon = s => { if (!s) return null; const [y, mo, d] = s.split('-').map(Number); return new Date(y, mo - 1, d, 12); };
const compact = n => new Intl.NumberFormat('ar-EG', { notation: 'compact', maximumFractionDigits: 1 }).format(n);
const safeImg = u => (/^(https?:\/\/|data:image\/)/i.test(String(u || '')) ? u : '');
const badge = (cls, t) => `<span class="badge ${cls}">${esc(t)}</span>`;

/* ================= التحميل ================= */
async function loadAll() {
  const cols = ['products', 'orders', 'suppliers', 'customers', 'expenses', 'coupons', 'reviews', 'questions'];
  const res = await Promise.allSettled(cols.map(c => getDocs(collection(db, c))));
  res.forEach((r, i) => {
    const c = cols[i];
    if (r.status === 'fulfilled') { data[c] = r.value.docs.map(d => ({ id: d.id, ...d.data() })); delete errors[c]; }
    else { errors[c] = r.reason?.code || r.reason?.message || 'error'; data[c] = []; console.warn('load failed', c, r.reason); }
  });
  ui.loaded = true; ui.loadedAt = Date.now();
  render();
}

/* ================= الحساب والرسم ================= */
function compute() {
  const range = A.makeRange(ui.range, new Date(), { from: toNoon(ui.from), to: toNoon(ui.to) });
  S = A.computeStats({
    orders: data.orders, products: data.products, expenses: data.expenses, coupons: data.coupons,
    range, countMode: cfg().accounting.countMode, lowStock: Number(cfg().accounting.lowStock) || 5
  });
}

function shell() {
  page.innerHTML = `
    <div class="toolbar no-print">
      <div class="chips" id="rangeChips">${RANGES.map(r => `<button class="chip" type="button" data-act="range" data-id="${r}">${A.RANGE_LABELS[r]}</button>`).join('')}</div>
      <span id="customRange" style="display:none;gap:8px;align-items:center;flex-wrap:wrap">
        <input type="date" id="rFrom" class="input" aria-label="من تاريخ"> <span class="muted">إلى</span> <input type="date" id="rTo" class="input" aria-label="إلى تاريخ">
      </span>
    </div>
    <div class="muted no-print" id="rangeNote" style="font-size:12px;margin:-8px 0 14px"></div>
    <div id="loadErr"></div>
    <div class="tabs no-print" id="tabs">${TABS.map(([k, l, ic]) => `<button class="tab" type="button" data-act="tab" data-id="${k}">${svg(ic)}${l}</button>`).join('')}</div>
    ${TABS.map(([k]) => `<section class="tab-content" id="tab-${k}"></section>`).join('')}`;
  $('#rFrom').value = ui.from; $('#rTo').value = ui.to;
}

function syncChrome() {
  $$('#rangeChips .chip').forEach(c => c.classList.toggle('active', c.dataset.id === ui.range));
  $('#customRange').style.display = ui.range === 'custom' ? 'flex' : 'none';
  $$('#tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.id === ui.tab));
  $$('.tab-content').forEach(t => t.classList.toggle('active', t.id === 'tab-' + ui.tab));
  const r = S.range;
  $('#rangeNote').textContent = (r.from || r.to)
    ? `الفترة: ${A.fmtDate(r.from)} ← ${A.fmtDate(r.to)} · احتساب الطلبات: ${A.COUNT_MODES[S.countMode].label}`
    : `كل الفترات · احتساب الطلبات: ${A.COUNT_MODES[S.countMode].label}`;
  const errKeys = Object.keys(errors);
  $('#loadErr').innerHTML = errKeys.length ? `
    <div class="alerts"><div class="alert-item warn">${svg('alert')}<div>تعذّر تحميل: <b>${errKeys.map(esc).join('، ')}</b> (${esc(errors[errKeys[0]])}).
    إذا كانت المجموعات الجديدة <b>expenses</b> و<b>coupons</b> و<b>images</b> و<b>image_chunks</b> فتأكد أن قواعد Firestore تسمح بالقراءة والكتابة عليها.</div></div></div>` : '';
}

function render() {
  if (!ui.loaded) return;
  compute();
  syncChrome();
  const fn = { overview: renderOverview, pnl: renderPnl, orders: renderOrders, products: renderProducts, expenses: renderExpenses, coupons: renderCoupons, feedback: renderFeedback }[ui.tab];
  fn();
  hydrateImages(page);
}

/* ---------- عناصر مساعدة ---------- */
function delta(x, inverse = false) {
  if (x === null || x === undefined || !isFinite(x)) return '';
  if (Math.abs(x) < 0.0005) return `<span class="delta">— ثابت</span>`;
  const up = x > 0, good = inverse ? !up : up;
  return `<span class="delta ${good ? 'up' : 'down'}" title="مقارنة بالفترة السابقة">${up ? '▲' : '▼'} ${pc(Math.abs(x), 0)}</span>`;
}
const kpi = (icon, label, value, sub = '', extra = '', cls = '') => `
  <div class="kpi ${cls}"><div class="k-top"><div class="k-icon">${svg(icon)}</div>${extra}</div>
  <div class="k-label">${label}</div><div class="k-value num">${value}</div>${sub ? `<div class="k-sub">${sub}</div>` : ''}</div>`;
const empty = (icon, t, p = '') => `<div class="empty-state">${svg(icon)}<h3>${t}</h3>${p ? `<p>${p}</p>` : ''}</div>`;

function chartHTML(series) {
  const b = series.buckets;
  if (!b.length || b.every(x => !x.sales && !x.expenses && !x.orderProfit)) return empty('chart', 'لا توجد حركة في هذه الفترة', 'ستظهر هنا المبيعات والمصروفات وصافي الربح.');
  const W = 760, H = 270, pl = 54, pr = 10, pt = 14, pb = 34, iw = W - pl - pr, ih = H - pt - pb;
  const vals = b.flatMap(x => [x.sales, x.expenses, x.net]);
  let max = Math.max(0, ...vals), min = Math.min(0, ...vals);
  if (max === min) max = min + 1;
  const y = v => pt + ih * (1 - (v - min) / (max - min));
  const bw = iw / b.length, barW = Math.max(2, Math.min(22, bw * 0.34));
  const xc = i => pl + bw * (i + 0.5);
  const lbl = x => series.granularity === 'day' ? `${x.date.getDate()}/${x.date.getMonth() + 1}` : new Intl.DateTimeFormat('ar-EG', { month: 'short', year: '2-digit' }).format(x.date);
  const step = Math.ceil(b.length / 8);
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = min + (max - min) * i / 4;
    g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-dasharray="3 4"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${compact(v)}</text>`;
  }
  g += `<line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--muted)" stroke-width="1.2"/>`;
  b.forEach((x, i) => {
    const s = y(x.sales), e = y(x.expenses), z = y(0);
    g += `<rect x="${xc(i) - barW - 1}" y="${Math.min(s, z)}" width="${barW}" height="${Math.abs(z - s)}" rx="3" style="fill:var(--green2)"/>`;
    g += `<rect x="${xc(i) + 1}" y="${Math.min(e, z)}" width="${barW}" height="${Math.abs(z - e)}" rx="3" style="fill:var(--gold)"/>`;
    if (i % step === 0 || i === b.length - 1) g += `<text x="${xc(i)}" y="${H - 12}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${lbl(x)}</text>`;
  });
  const pts = b.map((x, i) => `${xc(i)},${y(x.net)}`).join(' ');
  g += `<polyline points="${pts}" fill="none" style="stroke:var(--blue)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  b.forEach((x, i) => {
    g += `<circle cx="${xc(i)}" cy="${y(x.net)}" r="${b.length > 40 ? 0 : 3}" style="fill:var(--blue)"/>`;
    g += `<rect x="${pl + bw * i}" y="${pt}" width="${bw}" height="${ih}" fill="transparent"><title>${lbl(x)}\nالمبيعات: ${m(x.sales)}\nالمصروفات: ${m(x.expenses)}\nصافي: ${m(x.net)}\nالطلبات: ${x.orders}</title></rect>`;
  });
  return `<div class="legend"><span><i style="background:var(--green2)"></i>المبيعات</span><span><i style="background:var(--gold)"></i>المصروفات</span><span><i style="background:var(--blue)"></i>صافي الربح</span></div>
    <div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" style="direction:ltr" role="img" aria-label="رسم المبيعات والمصروفات وصافي الربح">${g}</svg></div>`;
}

/* ================= نظرة عامة ================= */
function renderOverview() {
  const t = S.totals, ch = S.changes, c = cfg(), sec = c.sections, cu = cur();
  const out = [];

  if (sec.alerts) {
    const al = [];
    if (t.isLoss) al.push(['danger', 'alert', `<b>${S.range.label}: خسارة صافية ${m(Math.abs(t.netProfit))}.</b> مجمل الربح ${m(t.grossProfit)} لا يغطي المصروفات والتكاليف الأخرى. راجع المصروفات أو الأسعار والخصومات.`]);
    else if (t.orderCount || t.expensesTotal) al.push(['ok', 'check', `صافي ربح <b>${m(t.netProfit)}</b> في «${S.range.label}» بهامش ${pc(t.netMargin)}.`]);
    if (t.missingCostOrders) al.push(['warn', 'alert', `<b>${t.missingCostOrders}</b> طلب بدون سعر تكلفة للمنتجات، لذلك الأرباح غير دقيقة. <a href="#products">أضف التكلفة من تبويب المنتجات</a>.`]);
    else if (S.inventory.noCost.length) al.push(['warn', 'alert', `${S.inventory.noCost.length} منتج بدون سعر تكلفة. <a href="#products">أضفها لتظهر الأرباح بدقة</a>.`]);
    if (S.inventory.low.length || S.inventory.outOfStock.length) al.push(['info', 'box', `المخزون: <b>${S.inventory.outOfStock.length}</b> منتج نفد و<b>${S.inventory.low.length}</b> منخفض (≤ ${c.accounting.lowStock}).`]);
    const pend = (S.allOrders.filter(o => o.status === 'pending').length);
    if (pend) al.push(['info', 'cart', `${pend} طلب بانتظار الدفع/المعالجة. <a href="#orders">راجع الطلبات</a>.`]);
    const undef = S.coupons.filter(x => x.undefinedCode);
    if (undef.length) al.push(['warn', 'percent', `أكواد استُخدمت في الطلبات وليست معرّفة: <b>${undef.map(x => esc(x.code)).join('، ')}</b>. <a href="#coupons">عرّفها</a>.`]);
    if (al.length) out.push(`<div class="alerts">${al.map(([k, ic, h]) => `<div class="alert-item ${k}">${svg(ic)}<div>${h}</div></div>`).join('')}</div>`);
  }

  if (sec.kpis) {
    const loss = t.isLoss;
    out.push(`<div class="kpis">
      ${kpi('trending', loss ? 'صافي الخسارة' : 'صافي الربح', m(t.netProfit), `هامش الربح الصافي ${pc(t.netMargin)} · ${S.range.label}`, ch ? delta(ch.netProfit) : '', 'hero' + (loss ? ' loss' : ''))}
      ${kpi('coins', 'صافي المبيعات', m(t.netSales), `قبل الخصم ${m(t.grossSales)}`, ch ? delta(ch.netSales) : '')}
      ${kpi('wallet', 'مجمل الربح', m(t.grossProfit), `هامش ${pc(t.grossMargin)}`, ch ? delta(ch.grossProfit) : '')}
      ${kpi('box', 'تكلفة البضاعة', m(t.cogs), `${A.fmtNum(t.itemsSold, 0)} قطعة مباعة`)}
      ${kpi('receipt', 'المصروفات', m(t.expensesTotal), `${S.expenses.length} بند`, ch ? delta(ch.expensesTotal, true) : '')}
      ${kpi('percent', 'الخصومات الممنوحة', m(t.discounts), `${pc(t.discountRate)} من المبيعات`)}
      ${kpi('cart', 'عدد الطلبات', A.fmtNum(t.orderCount, 0), `ملغي ${t.cancelled.count} · مسترجع ${t.refunds.count}`, ch ? delta(ch.orderCount) : '')}
      ${kpi('calc', 'متوسط قيمة الطلب', m(t.avgOrder), t.orderCount ? `متوسط الربح ${m((t.netProfit + t.expensesTotal) / t.orderCount)}` : '')}
      ${kpi('chart', 'نقطة التعادل', t.breakEven === null ? '—' : m(t.breakEven), t.breakEven === null ? 'لا يوجد هامش ربح بعد' : (t.netSales >= t.breakEven ? '✓ تجاوزت التعادل' : `ناقص ${m(t.breakEven - t.netSales)} للتعادل`))}
      ${kpi('truck', 'صافي الشحن', m(t.shippingCollected - t.shipCost), `محصّل ${m(t.shippingCollected)} − تكلفة ${m(t.shipCost)}`)}
      ${kpi('store', 'قيمة المخزون (بالتكلفة)', m(S.inventory.value), `${A.fmtNum(S.inventory.units, 0)} قطعة`)}
      ${kpi('gift', 'ربح المخزون المتوقع', m(S.inventory.potentialProfit), `قيمة البيع ${m(S.inventory.retail)}`)}
    </div>`);
  }

  if (sec.snapshot) {
    out.push(`<div class="snap">
      <div class="s"><div class="k-icon">${svg('box')}</div><div><b class="num">${A.fmtNum(data.products.length, 0)}</b><small>إجمالي المنتجات</small></div></div>
      <div class="s"><div class="k-icon">${svg('truck')}</div><div><b class="num">${A.fmtNum(data.suppliers.length, 0)}</b><small>الموردين</small></div></div>
      <div class="s"><div class="k-icon">${svg('users')}</div><div><b class="num">${A.fmtNum(data.customers.length, 0)}</b><small>العملاء</small></div></div>
    </div>`);
  }

  if (sec.actions) {
    const acts = c.actions.filter(x => x.visible !== false && !x.deleted);
    if (acts.length) out.push(`<div class="card"><div class="section-title"><h2>إجراءات سريعة</h2><a href="settings.html">تخصيص الأزرار ←</a></div>
      <div class="actions-grid">${acts.map(a => {
        const ext = /^https?:\/\//i.test(a.href) || a.newTab;
        return `<a class="action-btn" href="${esc(safeHref(a.href))}" ${ext ? 'target="_blank" rel="noopener"' : ''}>
          <div class="ab-icon" style="background:${COLORS[a.color] || COLORS.green}">${svg(a.icon)}</div>
          <div class="ab-text"><b>${esc(a.name)}</b>${a.desc ? `<small>${esc(a.desc)}</small>` : ''}</div></a>`;
      }).join('')}</div></div>`);
  }

  if (sec.chart) out.push(`<div class="card"><div class="section-title"><h2>${svg('chart')} المبيعات والمصروفات وصافي الربح</h2></div>${chartHTML(S.series)}</div>`);

  const cols = [];
  if (sec.topProducts) {
    const top = S.topProducts.slice(0, 6);
    cols.push(`<div class="card"><div class="section-title"><h2>أفضل المنتجات ربحًا</h2><a href="#products">كل المنتجات ←</a></div>
      ${top.length ? `<div class="table-wrap"><table><thead><tr><th>المنتج</th><th class="n">الكمية</th><th class="n">المبيعات</th><th class="n">الربح</th></tr></thead><tbody>
      ${top.map(p => `<tr><td><b>${esc(p.name)}</b>${p.missingCost ? ` <span title="بدون سعر تكلفة" class="neg">⚠</span>` : ''}</td><td class="n num">${A.fmtNum(p.qty, 0)}</td><td class="n num">${m(p.revenue)}</td><td class="n num ${p.profit < 0 ? 'neg' : 'pos'}">${m(p.profit)}</td></tr>`).join('')}
      </tbody></table></div>` : empty('box', 'لا توجد مبيعات في هذه الفترة')}</div>`);
  }
  if (sec.expenses) {
    const tot = S.totals.expensesTotal || 1;
    cols.push(`<div class="card"><div class="section-title"><h2>توزيع المصروفات</h2><a href="#expenses">إدارة المصروفات ←</a></div>
      ${S.expenseCategories.length ? `<div class="bar-list">${S.expenseCategories.slice(0, 7).map(e => `
        <div class="bar-row"><div class="top"><span>${esc(e.name)}</span><b class="num">${m(e.amount)} · ${pc(e.amount / tot, 0)}</b></div><div class="track"><div class="fill" style="width:${Math.max(2, e.amount / tot * 100)}%"></div></div></div>`).join('')}</div>`
        : empty('receipt', 'لا توجد مصروفات في هذه الفترة', 'سجّل الإيجار والإعلانات وغيرها لتظهر الأرباح الحقيقية.')}</div>`);
  }
  if (cols.length) out.push(`<div class="two-col">${cols.join('')}</div>`);

  if (sec.recentOrders) {
    const rec = [...S.allOrders].sort((a, b) => (b.date || 0) - (a.date || 0)).slice(0, 6);
    out.push(`<div class="card"><div class="section-title"><h2>أحدث الطلبات</h2><a href="#orders">عرض الكل ←</a></div>
      ${rec.length ? ordersTable(rec, { compact: true }) : empty('cart', 'لا توجد طلبات بعد', 'ستظهر هنا الطلبات الجديدة فور وصولها من Firestore.')}</div>`);
  }
  $('#tab-overview').innerHTML = out.join('') || empty('dashboard', 'كل الأقسام مخفية', 'يمكنك إظهارها من الإعدادات.');
}

function ordersTable(list, { compact: cmp = false, editable = false } = {}) {
  return `<div class="table-wrap"><table><thead><tr><th>رقم الطلب</th><th>التاريخ</th><th>العميل</th><th class="n">صافي المبيعات</th>
    ${cmp ? '' : '<th>الخصم</th><th class="n">التكلفة</th><th class="n">الربح</th>'}<th>الحالة</th></tr></thead><tbody>
    ${list.map(o => `<tr>
      <td class="num">#${esc(o.number)}</td><td>${A.fmtDate(o.date)}</td><td>${esc(o.customer)}</td>
      <td class="n num">${m(o.netSales)}</td>
      ${cmp ? '' : `<td>${o.discount ? `<span class="num">${m(o.discount)}</span>${o.coupon ? ' ' + badge('blue', o.coupon) : ''}` : '—'}</td>
        <td class="n num">${m(o.cogs)}</td>
        <td class="n num ${o.profit < 0 ? 'neg' : 'pos'}">${m(o.profit)}${o.missingCost ? ` <span class="neg" title="تكلفة ناقصة — الربح غير دقيق">⚠</span>` : ''}</td>`}
      <td>${editable
        ? `<select class="inline-select" data-change="status" data-id="${esc(o.id)}" aria-label="حالة الطلب">${Object.entries(A.STATUS_LABELS).map(([k, l]) => `<option value="${k}" ${o.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select>`
        : badge(A.STATUS_BADGE[o.status], A.STATUS_LABELS[o.status])}</td></tr>`).join('')}
    </tbody></table></div>`;
}

/* ================= الأرباح والخسائر ================= */
function renderPnl() {
  const t = S.totals, p = S.prev, cu = cur(), ns = t.netSales || 0;
  const pct = v => (ns > 0 ? pc(v / ns) : '—');

  const prevBlock = p ? `<div class="card"><div class="section-title"><h2>مقارنة بالفترة السابقة</h2></div><div class="table-wrap"><table>
    <thead><tr><th>البند</th><th class="n">الفترة الحالية</th><th class="n">الفترة السابقة</th><th class="n">التغيّر</th></tr></thead><tbody>

  const periodTbl = buckets.length ? `<div class="card"><div class="section-title"><h2>تفصيل ${S.series.granularity === 'day' ? 'يومي' : 'شهري'}</h2></div><div class="table-wrap"><table>

    ${buckets.map(b => `<tr><td>${S.series.granularity === 'day' ? A.fmtDate(b.date) : new Intl.DateTimeFormat('ar-EG', { month: 'long', year: 'numeric' }).format(b.date)}</td><td class="n num">${b.orders}</td><td class="n num">${m(b.sales)}</td><td class="n num">${m(b.orderProfit)}</td><td class="n num">${m(b.expenses)}</td><td class="n num ${b.net < 0 ? 'neg' : 'pos'}">${m(b.net)}</td></tr>`).join('')}
    </tbody></table></div></div>` : '';

  $('#tab-pnl').innerHTML = `
    <div class="toolbar no-print"><div class="grow"></div>
      <button class="btn btn-secondary btn-sm" type="button" data-act="csv-pnl">${svg('download')} تصدير CSV</button>
      <button class="btn btn-secondary btn-sm" type="button" onclick="window.print()">${svg('print')} طباعة</button></div>
    ${t.missingCostOrders ? `<div class="alerts"><div class="alert-item warn">${svg('alert')}<div>${t.missingCostOrders} طلب بدون تكلفة — تكلفة البضاعة ناقصة والأرباح مبالغ فيها. <a href="#products">أضف التكلفة</a>.</div></div></div>` : ''}
    <div class="card"><div class="section-title"><h2>قائمة الدخل — ${esc(S.range.label)}</h2><span class="muted" style="font-size:12px">${esc(A.COUNT_MODES[S.countMode].label)}</span></div>
      <div class="table-wrap"><table class="statement"><thead><tr><th>البند</th><th class="n">المبلغ</th><th class="n">٪ من صافي المبيعات</th></tr></thead><tbody>
        ${row('إجمالي المبيعات (قبل الخصم)', t.grossSales)}
        ${row('الخصومات وأكواد الخصم', t.discounts, 'sub', '− ')}
        ${row('صافي المبيعات', t.netSales, 'total')}
        ${row('تكلفة البضاعة المباعة', t.cogs, 'sub', '− ')}
        ${row('مجمل الربح', t.grossProfit, 'total')}
        ${row('رسوم الشحن المحصّلة من العملاء', t.shippingCollected, 'sub', '+ ')}
        ${row('تكلفة الشحن الفعلية', t.shipCost, 'sub', '− ')}
        ${row('رسوم الدفع والعمولات', t.fees, 'sub', '− ')}
        ${row('المصروفات التشغيلية', t.expensesTotal, 'total', '− ')}
        ${expRows}
        <tr class="final ${loss ? 'loss' : ''}"><td>${loss ? 'صافي الخسارة' : 'صافي الربح'}</td><td class="n num">${loss ? '−' : ''}${m(Math.abs(t.netProfit))}</td><td class="n num">${pct(t.netProfit)}</td></tr>
      </tbody></table></div></div>
    <div class="kpis">
      ${kpi('percent', 'هامش الربح الإجمالي', pc(t.grossMargin))}
      ${kpi('trending', 'هامش الربح الصافي', pc(t.netMargin))}
      ${kpi('chart', 'نقطة التعادل', t.breakEven === null ? '—' : m(t.breakEven))}
      ${kpi('calc', 'متوسط قيمة الطلب', m(t.avgOrder))}
    </div>
    ${prevBlock}${periodTbl}`;
}

function renderProducts() {
  const host = $('#tab-products');
  if (!host.dataset.built) {
    host.dataset.built = '1';
    host.innerHTML = `<div class="toolbar no-print">
      <input id="pQ" class="input" style="flex:1;min-width:160px" placeholder="ابحث عن منتج أو قسم...">
      <select id="pSort" class="input" style="width:auto" aria-label="ترتيب">
        <option value="profit">الأعلى ربحًا</option><option value="margin">الأعلى هامشًا</option><option value="sold">الأكثر مبيعًا</option>
        <option value="stock">الأقل مخزونًا</option><option value="nocost">بدون تكلفة أولًا</option><option value="name">الاسم</option></select></div>
      <div class="card" id="productsBody"></div>`;
    $('#pQ').addEventListener('input', debounce(e => { ui.productQ = e.target.value; fillProducts(); }, 200));
    $('#pSort').addEventListener('change', e => { ui.productSort = e.target.value; fillProducts(); });
  }
  $('#pSort').value = ui.productSort;
  fillProducts();
}
function fillProducts() {
  const q = ui.productQ.trim().toLowerCase();
  const rows = S.products.filter(p => !q || p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)).map(p => {
    const perf = S.productPerf.get(p.id) || S.productPerf.get(p.name.trim().toLowerCase()) || { qty: 0, profit: 0 };
    const margin = p.price > 0 ? (p.price - p.cost) / p.price : 0;
    return { p, perf, margin };
  });
  const sorters = {
    profit: (a, b) => b.perf.profit - a.perf.profit, margin: (a, b) => b.margin - a.margin, sold: (a, b) => b.perf.qty - a.perf.qty,
    stock: (a, b) => (a.p.stock ?? 1e9) - (b.p.stock ?? 1e9), nocost: (a, b) => (a.p.costKnown ? 1 : 0) - (b.p.costKnown ? 1 : 0),
    name: (a, b) => a.p.name.localeCompare(b.p.name, 'ar')
  };
  rows.sort(sorters[ui.productSort]);
  $('#productsBody').innerHTML = rows.length ? `<div class="table-wrap"><table><thead><tr>
    <th>المنتج</th><th>القسم</th><th class="n">السعر</th><th class="n">التكلفة</th><th class="n">الهامش</th><th class="n">المخزون</th><th class="n">قيمة المخزون</th><th class="n">مباع</th><th class="n">ربح الفترة</th></tr></thead><tbody>
    ${rows.slice(0, 300).map(({ p, perf, margin }) => {
      const img = p.imageId ? `<img class="thumb" data-img="${esc(p.imageId)}" alt="">` : (safeImg(p.image) ? `<img class="thumb" src="${esc(safeImg(p.image))}" alt="" loading="lazy">` : `<span class="thumb empty">${svg('image')}</span>`);
      return `<tr><td><div class="cell-flex">${img}<b>${esc(p.name)}</b></div></td><td>${esc(p.category) || '—'}</td>
        <td class="n num">${m(p.price)}</td>
        <td class="n num">${p.costKnown ? m(p.cost) : '<span class="neg">غير مُدخلة</span>'} <button class="link-btn no-print" type="button" data-act="edit-product" data-id="${esc(p.id)}">تعديل</button></td>
        <td class="n num ${margin < 0 ? 'neg' : ''}">${p.price > 0 && p.costKnown ? pc(margin, 0) : '—'}</td>
        <td class="n num ${p.stock !== null && p.stock <= 0 ? 'neg' : ''}">${p.stock === null ? '—' : A.fmtNum(p.stock, 0)}</td>
        <td class="n num">${p.stock === null ? '—' : m(Math.max(p.stock, 0) * p.cost)}</td>
        <td class="n num">${A.fmtNum(perf.qty, 0)}</td><td class="n num ${perf.profit < 0 ? 'neg' : perf.profit > 0 ? 'pos' : ''}">${m(perf.profit)}</td></tr>`;
    }).join('')}</tbody></table></div>` : empty('box', 'لا توجد منتجات', 'أضف منتجات من صفحة المنتجات.');
  hydrateImages($('#productsBody'));
}
function editProduct(id) {
  const p = S.products.find(x => x.id === id); if (!p) return;
  openModal({
    title: `تعديل: ${p.name}`,
    body: `<div class="field"><label>سعر التكلفة (${esc(cur())})</label><input type="number" inputmode="decimal" step="0.01" min="0" id="fCost" value="${p.costKnown ? p.cost : ''}" placeholder="كم تكلفتك للقطعة؟"><small>يُستخدم لحساب الأرباح بدقة.</small></div>
           <div class="field"><label>الكمية في المخزون</label><input type="number" inputmode="numeric" step="1" id="fStock" value="${p.stock === null ? '' : p.stock}"></div>`,
    onSave: async box => {
      const patch = {};
      const cost = $('#fCost', box).value, stock = $('#fStock', box).value;
      if (cost !== '') patch.cost = Math.max(0, Number(cost));
      if (stock !== '') patch.stock = Math.round(Number(stock));
      if (!Object.keys(patch).length) return false;
      await updateDoc(doc(db, 'products', id), patch);
      const rec = data.products.find(x => x.id === id); Object.assign(rec, patch);
      toast('✓ تم حفظ المنتج'); render();
    }
  });
}

function expenseForm(e = {}) {

function readExpense(box) {
  const title = $('#eTitle', box).value.trim(), amount = Number($('#eAmount', box).value), date = $('#eDate', box).value;
  if (!title) throw new Error('اكتب اسم المصروف');
  if (!(amount > 0)) throw new Error('المبلغ يجب أن يكون أكبر من صفر');
  if (!date) throw new Error('اختر التاريخ');
  return { title, amount: A.r2(amount), category: $('#eCat', box).value.trim() || 'أخرى', note: $('#eNote', box).value.trim(), date: Timestamp.fromDate(toNoon(date)) };
}
function addExpense() {
  openModal({ title: 'تسجيل مصروف', body: expenseForm(), saveLabel: 'حفظ المصروف', onSave: async box => {
    const e = readExpense(box);
    const ref = await addDoc(collection(db, 'expenses'), { ...e, createdAt: serverTimestamp() });
    data.expenses.push({ id: ref.id, ...e, date: e.date.toDate() });
    toast('✓ تم تسجيل المصروف'); render();
  } });
}
function editExpense(id) {
  const e = S.allExpenses.find(x => x.id === id); if (!e) return;
  openModal({ title: 'تعديل المصروف', body: expenseForm(e), onSave: async box => {
    const n = readExpense(box);
    await updateDoc(doc(db, 'expenses', id), n);
    const rec = data.expenses.find(x => x.id === id); Object.assign(rec, n, { date: n.date.toDate() });
    toast('✓ تم التعديل'); render();
  } });
}
async function delExpense(id) {
  if (!await confirmDialog('حذف هذا المصروف نهائيًا؟ سيتغيّر صافي الربح.', { okLabel: 'حذف' })) return;
  await deleteDoc(doc(db, 'expenses', id));
  data.expenses = data.expenses.filter(x => x.id !== id);
  toast('تم حذف المصروف'); render();
}

function couponForm(c = {}) {
  return `<div class="row-2"><div class="field"><label>الكود</label><input id="cCode" value="${esc(c.code || '')}" placeholder="SALE20" style="text-transform:uppercase;direction:ltr;text-align:right" maxlength="30"></div>
    <div class="field"><label>نوع الخصم</label><select id="cType"><option value="percent" ${c.type !== 'fixed' ? 'selected' : ''}>نسبة مئوية ٪</option><option value="fixed" ${c.type === 'fixed' ? 'selected' : ''}>مبلغ ثابت</option></select></div></div>
    <div class="row-2"><div class="field"><label>قيمة الخصم</label><input id="cValue" type="number" inputmode="decimal" step="0.01" min="0" value="${c.value ?? ''}"></div>
    <div class="field"><label>الحد الأدنى للطلب</label><input id="cMin" type="number" inputmode="decimal" min="0" value="${c.minOrder || ''}" placeholder="0"></div></div>
    <div class="row-2"><div class="field"><label>سقف الخصم (للنسبة)</label><input id="cMax" type="number" inputmode="decimal" min="0" value="${c.maxDiscount || ''}" placeholder="بدون سقف"></div>
    <div class="field"><label>عدد مرات الاستخدام</label><input id="cLimit" type="number" inputmode="numeric" min="0" value="${c.usageLimit || ''}" placeholder="غير محدود"></div></div>
    <div class="row-2"><div class="field"><label>يبدأ في</label><input id="cStart" type="date" value="${A.toInputDate(c.startsAt)}" ${c.exact ? 'disabled' : ''}></div>
    <div class="field"><label>ينتهي في</label><input id="cEnd" type="date" value="${A.toInputDate(c.expiresAt)}" ${c.exact ? 'disabled' : ''}></div></div>
    ${c.exact ? `<div class="alert-item info" style="margin-bottom:12px">${svg('calc')}<div>مدة هذا الكود محددة بالدقيقة${c.productName ? ` لمنتج «${esc(c.productName)}»` : ''} — تُعدَّل من صفحة المنتج.</div></div>` : ''}
    <label class="check-row"><input type="checkbox" id="cActive" ${c.active !== false ? 'checked' : ''}> الكود فعّال</label>`;
}
function readCoupon(box, editingId) {
  const code = $('#cCode', box).value.trim().toUpperCase().replace(/\s+/g, '');
  const value = Number($('#cValue', box).value), type = $('#cType', box).value;
  if (!code) throw new Error('اكتب الكود');
  if (!(value > 0)) throw new Error('قيمة الخصم يجب أن تكون أكبر من صفر');
  if (type === 'percent' && value > 100) throw new Error('النسبة لا تزيد عن 100٪');
  if (data.coupons.some(c => c.id !== editingId && String(c.code).toUpperCase() === code)) throw new Error('هذا الكود موجود بالفعل');
  const d = id => { const v = $(id, box).value; return v ? Timestamp.fromDate(toNoon(v)) : null; };
  const prev = editingId ? data.coupons.find(x => x.id === editingId) : null;
  const dates = prev && prev.exact ? {} : { startsAt: d('#cStart'), expiresAt: d('#cEnd') };   // لا نكسر وقت الكود الدقيق
  return {
    code, type, value, minOrder: Number($('#cMin', box).value) || 0, maxDiscount: Number($('#cMax', box).value) || null,
    usageLimit: Number($('#cLimit', box).value) || null, ...dates, active: $('#cActive', box).checked
  };
}
function addCoupon(preset = {}) {
  openModal({ title: 'كود خصم جديد', body: couponForm(preset), saveLabel: 'حفظ الكود', wide: true, onSave: async box => {
    const c = readCoupon(box, null);
    const ref = await addDoc(collection(db, 'coupons'), { ...c, createdAt: serverTimestamp() });
    data.coupons.push({ id: ref.id, ...c }); toast('✓ تم إنشاء الكود'); render();
  } });
}
function editCoupon(id) {
  const c = data.coupons.find(x => x.id === id); if (!c) return;
  openModal({ title: 'تعديل الكود', body: couponForm(A.normalizeCoupon(c)), wide: true, onSave: async box => {
    const n = readCoupon(box, id);
    await updateDoc(doc(db, 'coupons', id), n); Object.assign(c, n); toast('✓ تم التعديل'); render();
  } });
}
async function toggleCoupon(id) {
  const c = data.coupons.find(x => x.id === id); if (!c) return;
  const active = c.active === false; await updateDoc(doc(db, 'coupons', id), { active }); c.active = active;
  toast(active ? 'تم تفعيل الكود' : 'تم إيقاف الكود'); render();
}
async function delCoupon(id) {
  if (!await confirmDialog('حذف كود الخصم نهائيًا؟ الطلبات القديمة لن تتأثر.', { okLabel: 'حذف' })) return;
  await deleteDoc(doc(db, 'coupons', id)); data.coupons = data.coupons.filter(x => x.id !== id); toast('تم حذف الكود'); render();
}

/* ================= التقييمات والأسئلة ================= */
const fbDate = v => { const d = A.toDate(v); return d ? new Intl.DateTimeFormat('ar-EG', { dateStyle: 'medium' }).format(d) : ''; };
const fbTime = x => (A.toDate(x.createdAt) || new Date(0)).getTime();
function renderFeedback() {
  const rv = [...data.reviews].sort((a, b) => fbTime(b) - fbTime(a)), qs = [...data.questions].sort((a, b) => fbTime(b) - fbTime(a));
  const avg = rv.length ? rv.reduce((s, r) => s + (Number(r.rating) || 0), 0) / rv.length : 0;
  const pend = qs.filter(q => !q.a).length;
  const stars = n => '★'.repeat(Math.round(n)) + '☆'.repeat(5 - Math.round(n));
  const v = ui.fbView;
  $('#tab-feedback').innerHTML = `
    <div class="kpis">${kpi('star', 'متوسط التقييم', avg ? avg.toFixed(1) + ' / 5' : '—', `${A.fmtNum(rv.length, 0)} تقييم`)}${kpi('eye', 'تقييمات مخفية', A.fmtNum(rv.filter(r => r.hidden).length, 0))}${kpi('bell', 'أسئلة بلا رد', A.fmtNum(pend, 0), `من ${A.fmtNum(qs.length, 0)} سؤال`)}</div>
    <div class="toolbar no-print"><button class="btn ${v === 'reviews' ? 'btn-primary' : 'btn-secondary'}" type="button" data-act="fb-view" data-id="reviews">التقييمات (${rv.length})</button>
      <button class="btn ${v === 'questions' ? 'btn-primary' : 'btn-secondary'}" type="button" data-act="fb-view" data-id="questions">الأسئلة (${qs.length})</button></div>
    ${errors.reviews || errors.questions ? `<div class="card muted">تعذّر تحميل بعض البيانات — تحقق من قواعد Firestore لمجموعتي reviews وquestions.</div>` : ''}
    <div class="card">${v === 'reviews' ? (rv.length ? rv.map(r => `<div class="fb-item" style="padding:12px 0;border-bottom:1px solid var(--line)">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(r.name || 'عميل')}</b><span style="color:#d99a1b">${stars(r.rating)}</span>${r.hidden ? badge('gold', 'مخفي') : ''}<span class="muted" style="font-size:12px">${esc(r.productName || '')} · ${fbDate(r.createdAt)}</span></div>
        ${r.title ? `<div><b>${esc(r.title)}</b></div>` : ''}<p style="margin:4px 0;white-space:pre-wrap">${esc(r.text)}</p>${r.reply ? `<div class="muted" style="font-size:13px">رد المتجر: ${esc(r.reply)}</div>` : ''}
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><button class="btn btn-secondary btn-sm" type="button" data-act="rv-reply" data-id="${esc(r.id)}">${r.reply ? 'تعديل الرد' : 'رد'}</button>
        <button class="btn btn-secondary btn-sm" type="button" data-act="rv-hide" data-id="${esc(r.id)}">${r.hidden ? 'إظهار' : 'إخفاء'}</button>
        <button class="btn btn-danger btn-sm" type="button" data-act="rv-del" data-id="${esc(r.id)}">حذف</button></div></div>`).join('') : empty('star', 'لا توجد تقييمات بعد', 'ستظهر هنا تقييمات العملاء من المتجر.'))
    : (qs.length ? qs.map(q => `<div class="fb-item" style="padding:12px 0;border-bottom:1px solid var(--line)">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(q.name || 'عميل')}</b>${q.a ? badge('green', 'تم الرد') : badge('gold', 'بانتظار الرد')}${q.hidden ? badge('gold', 'مخفي') : ''}<span class="muted" style="font-size:12px">${esc(q.productName || '')} · ${fbDate(q.createdAt)}</span></div>
        <p style="margin:4px 0">س: ${esc(q.q)}</p>${q.a ? `<div class="muted" style="font-size:13px">الجواب: ${esc(q.a)}</div>` : ''}
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><button class="btn btn-primary btn-sm" type="button" data-act="q-answer" data-id="${esc(q.id)}">${q.a ? 'تعديل الجواب' : 'أجب'}</button>
        <button class="btn btn-secondary btn-sm" type="button" data-act="q-hide" data-id="${esc(q.id)}">${q.hidden ? 'إظهار' : 'إخفاء'}</button>
        <button class="btn btn-danger btn-sm" type="button" data-act="q-del" data-id="${esc(q.id)}">حذف</button></div></div>`).join('') : empty('bell', 'لا توجد أسئلة', 'ستظهر هنا أسئلة العملاء عن المنتجات.'))}</div>`;
}
function replyModal(col, id, field, title, label) {
  const rec = data[col].find(x => x.id === id); if (!rec) return;
  openModal({ title, body: `<div class="field"><label>${label}</label><textarea id="fbText" rows="4" maxlength="800">${esc(rec[field] || '')}</textarea></div>`, saveLabel: 'حفظ', onSave: async box => {
    const val = $('#fbText', box).value.trim(); await updateDoc(doc(db, col, id), { [field]: val }); rec[field] = val; toast('✓ تم الحفظ'); render();
  } });
}
const fbToggle = col => async id => { const r = data[col].find(x => x.id === id); if (!r) return; const hidden = !r.hidden; await updateDoc(doc(db, col, id), { hidden }); r.hidden = hidden; toast(hidden ? 'تم الإخفاء عن المتجر' : 'تم الإظهار'); render(); };
const fbDelete = col => async id => { if (!await confirmDialog('حذف نهائي؟', { okLabel: 'حذف' })) return; await deleteDoc(doc(db, col, id)); data[col] = data[col].filter(x => x.id !== id); toast('تم الحذف'); render(); };

/* ================= التصدير ================= */
function exportPnl() {
  const t = S.totals;
  const rows = [['قائمة الدخل', S.range.label], ['البند', 'المبلغ'],
    ['إجمالي المبيعات', t.grossSales], ['الخصومات', -t.discounts], ['صافي المبيعات', t.netSales], ['تكلفة البضاعة', -t.cogs], ['مجمل الربح', t.grossProfit],
    ['شحن محصّل', t.shippingCollected], ['تكلفة الشحن', -t.shipCost], ['رسوم الدفع', -t.fees], ['المصروفات', -t.expensesTotal],
    ...S.expenseCategories.map(e => ['  ' + e.name, -e.amount]), [t.isLoss ? 'صافي الخسارة' : 'صافي الربح', t.netProfit], [],
    ['التاريخ', 'الطلبات', 'المبيعات', 'ربح الطلبات', 'المصروفات', 'الصافي'],
    ...S.series.buckets.map(b => [A.dayKey(b.date), b.orders, b.sales, b.orderProfit, b.expenses, b.net])];
  download(`weshah-pnl-${A.dayKey(new Date())}.csv`, A.toCSV(rows));
}
function exportOrders() {
  const rows = [['رقم الطلب', 'التاريخ', 'العميل', 'الحالة', 'قبل الخصم', 'الخصم', 'الكود', 'صافي المبيعات', 'التكلفة', 'شحن محصّل', 'تكلفة الشحن', 'رسوم', 'الربح', 'تكلفة ناقصة'],
    ...filteredOrders().map(o => [o.number, o.date ? A.dayKey(o.date) : '', o.customer, A.STATUS_LABELS[o.status], o.subtotal, o.discount, o.coupon, o.netSales, o.cogs, o.shipping, o.shipCost, o.fees, o.profit, o.missingCost ? 'نعم' : ''])];
  download(`weshah-orders-${A.dayKey(new Date())}.csv`, A.toCSV(rows));
}

/* ================= الأحداث ================= */
const actions = {
  reload: async () => { toast('جارٍ التحديث...'); await loadAll(); toast('✓ تم تحديث البيانات'); },
  tab: id => { location.hash = id; },
  range: id => {
    ui.range = id; try { localStorage.setItem('weshah-range', id); } catch (_) {}
    if (id === 'custom' && !ui.from) { const d = new Date(); ui.to = A.toInputDate(d); ui.from = A.toInputDate(A.addDays(d, -29)); $('#rFrom').value = ui.from; $('#rTo').value = ui.to; }
    render();
  },
  'csv-pnl': exportPnl, 'csv-orders': exportOrders,
  'edit-product': editProduct, 'add-expense': addExpense, 'edit-expense': editExpense, 'del-expense': delExpense,
  'add-coupon': () => addCoupon(), 'define-coupon': code => addCoupon({ code }), 'edit-coupon': editCoupon, 'toggle-coupon': toggleCoupon, 'del-coupon': delCoupon,
  'fb-view': id => { ui.fbView = id; render(); }, 'rv-reply': id => replyModal('reviews', id, 'reply', 'الرد على التقييم', 'ردّك (يظهر للعملاء)'), 'rv-hide': fbToggle('reviews'), 'rv-del': fbDelete('reviews'),
  'q-answer': id => replyModal('questions', id, 'a', 'الإجابة على السؤال', 'الجواب (يظهر للعملاء)'), 'q-hide': fbToggle('questions'), 'q-del': fbDelete('questions')
};
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = actions[el.dataset.act]; if (!fn) return;
  try { await fn(el.dataset.id); } catch (err) { console.error(err); toast(err.message || 'حدث خطأ', 'error'); }
});
document.addEventListener('change', async e => {
  const el = e.target.closest('[data-change="status"]'); if (!el) return;
  const id = el.dataset.id, status = el.value, rec = data.orders.find(o => o.id === id);
  try { await updateDoc(doc(db, 'orders', id), { status }); if (rec) rec.status = status; toast('✓ تم تحديث حالة الطلب'); render(); }
  catch (err) { console.error(err); toast('تعذّر تحديث الحالة: ' + (err.message || ''), 'error'); render(); }
});

function onHash() {
  const h = location.hash.replace('#', '');
  ui.tab = TABS.some(t => t[0] === h) ? h : 'overview';
  render();
  window.scrollTo({ top: 0 });
}
window.addEventListener('hashchange', onHash);
document.addEventListener('weshah:config-ready', () => render());
document.addEventListener('weshah:config', () => render());
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - ui.loadedAt > 120000) loadAll(); });

/* ===== البداية ===== */
shell();
$('#rFrom').addEventListener('change', e => { ui.from = e.target.value; try { localStorage.setItem('weshah-from', ui.from); } catch (_) {} render(); });
$('#rTo').addEventListener('change', e => { ui.to = e.target.value; try { localStorage.setItem('weshah-to', ui.to); } catch (_) {} render(); });
const h0 = location.hash.replace('#', ''); if (TABS.some(t => t[0] === h0)) ui.tab = h0;
$('#tab-overview').innerHTML = `<div class="kpis">${'<div class="skeleton"></div>'.repeat(4)}</div><div class="skeleton" style="min-height:260px"></div>`;
$$('.tab-content').forEach(t => t.classList.toggle('active', t.id === 'tab-' + ui.tab));
$$('#tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.id === ui.tab));
loadAll();
</script>
</body>
</html>
